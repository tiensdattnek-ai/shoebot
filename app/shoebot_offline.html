 bé 21cm tương đương size trẻ em US 1Y / EU 32 (khoảng 6–7 tuổi). Trẻ nhỏ nên chọn giày dư 0.5–1cm (khoảng 1 ngón út) để chân phát triển; trẻ 5–10 tuổi đo lại chân mỗi 3–6 tháng; đế mềm, gập được ở 1/3 trước bàn chân là phù hợp.", "tags": "chân bé 21cm 21 cm size trẻ em trẻ nhỏ em bé"}, {"cat": "Size", "title": "Chân bé 22 cm – chọn size nào", "text": "Chân bé 22cm tương đương size trẻ em US 2Y / EU 34 (khoảng 7–8 tuổi). Trẻ nhỏ nên chọn giày dư 0.5–1cm (khoảng 1 ngón út) để chân phát triển; trẻ 5–10 tuổi đo lại chân mỗi 3–6 tháng; đế mềm, gập được ở 1/3 trước bàn chân là phù hợp.", "tags": "chân bé 22cm 22 cm size trẻ em trẻ nhỏ em bé"}, {"cat": "Size", "title": "Bảng size trẻ em (quy đổi cm – US – EU – tuổi)", "text": "• 12cm → US 5C / EU 21 (khoảng 9–15 tháng tuổi)\n• 13cm → US 6C / EU 22 (khoảng 1–1.5 tuổi tuổi)\n• 14cm → US 7C / EU 23 (khoảng 1.5–2 tuổi tuổi)\n• 15cm → US 8C / EU 24 (khoảng 2–2.5 tuổi tuổi)\n• 16cm → US 9C / EU 25 (khoảng 2.5–3 tuổi tuổi)\n• 17cm → US 10C / EU 27 (khoảng 3–3.5 tuổi tuổi)\n• 18cm → US 11C / EU 28 (khoảng 4 tuổi tuổi)\n• 19cm → US 12C / EU 30 (khoảng 5 tuổi tuổi)\n• 20cm → US 13C / EU 31 (khoảng 5–6 tuổi tuổi)\n• 21cm → US 1Y / EU 32 (khoảng 6–7 tuổi tuổi)\n• 22cm → US 2Y / EU 34 (khoảng 7–8 tuổi tuổi)\nTrẻ nhỏ nên chọn giày dư 0.5–1cm (khoảng 1 ngón út) để chân phát triển; trẻ 5–10 tuổi đo lại chân mỗi 3–6 tháng; đế mềm, gập được ở 1/3 trước bàn chân là phù hợp.", "tags": "bảng size trẻ em bé cm us eu tuổi"}, {"cat": "Size", "title": "Chân 22 cm – chọn size nào", "text": "Chân khoảng 22cm thì rơi vào vùng:\n• EU 37.5 – 38\n• US nam 5 – 5.5\n• UK 4.5 – 5\n• US nữ tương đương 6.5 – 7\nNếu chân đúng 22cm: chọn EU 38 cho thoải mái (hoặc EU 37.5 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 22cm 22 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 23 cm – chọn size nào", "text": "Chân khoảng 23cm thì rơi vào vùng:\n• EU 37.5 – 38\n• US nam 5 – 5.5\n• UK 4.5 – 5\n• US nữ tương đương 6.5 – 7\nNếu chân đúng 23cm: chọn EU 38 cho thoải mái (hoặc EU 37.5 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 23cm 23 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 24 cm – chọn size nào", "text": "Chân khoảng 24cm thì rơi vào vùng:\n• EU 38.5 – 39\n• US nam 6 – 6.5\n• UK 5.5 – 6\n• US nữ tương đương 7.5 – 8\nNếu chân đúng 24cm: chọn EU 39 cho thoải mái (hoặc EU 38.5 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 24cm 24 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 25 cm – chọn size nào", "text": "Chân khoảng 25cm thì rơi vào vùng:\n• EU 40 – 40.5\n• US nam 7 – 7.5\n• UK 6.5 – 7\n• US nữ tương đương 8.5 – 9\nNếu chân đúng 25cm: chọn EU 40.5 cho thoải mái (hoặc EU 40 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 25cm 25 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 26 cm – chọn size nào", "text": "Chân khoảng 26cm thì rơi vào vùng:\n• EU 41 – 42\n• US nam 8 – 8.5\n• UK 7.5 – 8\n• US nữ tương đương 9.5 – 10\nNếu chân đúng 26cm: chọn EU 42 cho thoải mái (hoặc EU 41 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 26cm 26 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 27 cm – chọn size nào", "text": "Chân khoảng 27cm thì rơi vào vùng:\n• EU 42.5 – 43\n• US nam 9 – 9.5\n• UK 8.5 – 9\n• US nữ tương đương 10.5 – 11\nNếu chân đúng 27cm: chọn EU 43 cho thoải mái (hoặc EU 42.5 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 27cm 27 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân 28 cm – chọn size nào", "text": "Chân khoảng 28cm thì rơi vào vùng:\n• EU 44 – 44.5\n• US nam 10 – 10.5\n• UK 9.5 – 10\n• US nữ tương đương 11.5 – 12\nNếu chân đúng 28cm: chọn EU 44.5 cho thoải mái (hoặc EU 44 nếu chân thon). Nguyên tắc: đo cuối buổi chiều, còn dư ~1cm ở mũi là vừa.", "tags": "chân 28cm 28 cm size bao nhiêu nam nữ quy đổi us eu uk"}, {"cat": "Size", "title": "Chân bè / chân bẹt – nên chọn giày nào", "text": "Chân bè nên ưu tiên:\n• New Balance có size bề ngang D/2E/4E (lựa chọn chuẩn nhất)\n• Nike Air Force 1, Air Max 1 (mũi rộng) – nhưng Dunk/Air Max hơi hẹp\n• Asics, Mizuno (form châu Á), Brooks (form Mỹ rộng)\n• Với dòng hẹp ngang (Samba, Gazelle, Speedcat, Dunk): tăng 0.5–1 size\n• Chân bẹt khi chạy nên chọn giày ổn định: Asics GEL-Kayano / GT-2000, Brooks Adrenaline GTS, Hoka Arahi, New Balance 860", "tags": "chân bè chân bẹt bề ngang 2E 4E nên chọn giày nào"}, {"cat": "Size", "title": "Chân 25cm đi giày size bao nhiêu?", "text": "Chân 25cm: US nam 7.5 = UK 7 = EU 40.5 (chuẩn Nike). Adidas EU 41 1/3 (25.4cm) bảng riêng. Nếu chân bè hoặc mẫu hẹp ngang (Dunk, Samba), lên nửa size. Giày chạy nên thêm 1–1.5cm.", "tags": "size Chân 25cm đi giày size bao nhiêu?"}, {"cat": "Size", "title": "Chân 26cm đi size mấy?", "text": "Chân 26cm: US nam 8.5 = UK 8 = EU 42 (Nike). Nữ thì US nữ ≈ 10. Đo cuối ngày cho chính xác nhất.", "tags": "size Chân 26cm đi size mấy?"}, {"cat": "Size", "title": "Nike và Adidas cùng size không?", "text": "Không hẳn. Nike dùng size liền mạch (41, 42, 43) còn Adidas dùng bước 1/3 (41 1/3, 42, 42 2/3). Adidas 42 thường nhỏ hơn Nike 42 một chút. Cách chắc nhất: so theo cm (chân dài bao nhiêu cm).", "tags": "size Nike và Adidas cùng size không?"}, {"cat": "Size", "title": "Size giày nữ và nam khác nhau thế nào?", "text": "Giày UNISEX dùng size nam: size nữ = size nam + 1.5 (ví dụ nữ US 8 ≈ nam US 6.5). Ở bảng cm: chân 24cm → nam US 6.5 / nữ US 8.", "tags": "size Size giày nữ và nam khác nhau thế nào?"}, {"cat": "Size", "title": "Chân bè có phải tăng size không?", "text": "Tăng 0.5 size nếu mẫu HẸP NGANG (Dunk, Samba, Gazelle, Salomon XT-6, On Cloud). Không cần tăng với Air Force 1, New Balance 574/530, Asics, Mizuno vì form rộng sẵn. Nếu tăng quá 1 size sẽ bị nhấc gót, đau gót khi đi.", "tags": "size Chân bè có phải tăng size không?"}, {"cat": "Size", "title": "Giày Converse/Vans có cần giảm size không?", "text": "Có. Chuck Taylor All Star và Vans Classic (Old Skool, Authentic) thường chạy dài 0.5 size — nhiều người giảm 0.5. Riêng Chuck 70 ôm chân hơn, thử trước khi quyết.", "tags": "size Giày Converse/Vans có cần giảm size không?"}, {"cat": "Size", "title": "Mua online không thử được thì chọn sao cho đúng size?", "text": "Đo chân đúng cách rồi tra bảng cm; ưu tiên shop có đổi size miễn phí; nếu chân ở đúng giữa 2 size → chọn size lớn hơn nếu là chân bè, chọn size nhỏ nếu chân thon và mẫu giày rộng.", "tags": "size Mua online không thử được thì chọn sao cho đúng size?"}, {"cat": "Size", "title": "Đi size 40 mua Converse size 40 có vừa không?", "text": "Thường KHÔNG vì Converse (All Star) đi dài hơn; người size 40 thường hợp Chuck size US 8 (≈41). Tốt nhất thử hoặc đo cm trước: nếu chân 25cm thì Chuck US 8–9 tuỳ form.", "tags": "size Đi size 40 mua Converse size 40 có vừa không?"}, {"cat": "Size", "title": "Trẻ em mua giày size sao cho phù hợp?", "text": "Đo chân bé theo cm, cộng 0.5–1cm; bảng: chân 18cm ≈ US 11C/EU 28 (khoảng 4 tuổi). Kiểm tra lại mỗi 3–6 tháng vì chân bé lên nhanh; đế mềm gập được ở 1/3 trước bàn chân.", "tags": "size Trẻ em mua giày size sao cho phù hợp?"}, {"cat": "Size", "title": "Chân vòm thấp (bẹt) đi giày size thế nào?", "text": "Size vẫn theo cm như thường; quan trọng là chọn mẫu CÓ HỖ TRỢ ỔN ĐỊNH (Kayano, Adrenaline GTS, Arahi, NB 860) và có thể thêm lót hỗ trợ vòm. Đừng mua size lớn hơn chỉ vì vòm thấp.", "tags": "size Chân vòm thấp (bẹt) đi giày size thế nào?"}, {"cat": "Hỏi đáp", "title": "Bên shop có bán hàng chính hãng không?", "text": "Dạ shop cam kết hàng chính hãng 100%, có hóa đơn và tem đầy đủ, sai đền gấp đôi ạ. Anh/chị có thể check mã sản phẩm trên website hãng trước khi mua.", "tags": "Bên shop có bán hàng chính hãng không?"}, {"cat": "Hỏi đáp", "title": "Giày bên shop có bảo hành không?", "text": "Dạ có ạ: bảo hành keo/đế 6 tháng cho lỗi sản xuất (bong keo, hở đế do nhà sản xuất), hỗ trợ vệ sinh miễn phí 1 lần trong 3 tháng đầu. Riêng hư hại do sử dụng (cắt, cháy, ngâm nước) không thuộc bảo hành.", "tags": "Giày bên shop có bảo hành không?"}, {"cat": "Hỏi đáp", "title": "Mua xong không vừa size có đổi được không?", "text": "Dạ được ạ – đổi size trong 7 ngày, giày còn nguyên tem/hộp, chưa dùng ngoài trời. Shop hỗ trợ đổi 1 lần miễn phí, từ lần thứ 2 phụ phí ship nhé ạ.", "tags": "Mua xong không vừa size có đổi được không?"}, {"cat": "Hỏi đáp", "title": "Shop có ship toàn quốc không? Bao lâu nhận hàng?", "text": "Dạ ship toàn quốc ạ. Nội thành 1–2 ngày, tỉnh 2–4 ngày làm việc. Đơn từ 1 triệu shop freeship, dưới 1 triệu phí 25–35k tùy khu vực ạ.", "tags": "Shop có ship toàn quốc không? Bao lâu nhận hàng?"}, {"cat": "Hỏi đáp", "title": "Có được kiểm hàng (đồng kiểm) khi nhận không?", "text": "Dạ có ạ, anh/chị được mở hộp kiểm tra trước khi thanh toán. Nhớ quay clip lúc mở hàng để hai bên xử lý nhanh nếu có vấn đề nhé.", "tags": "Có được kiểm hàng (đồng kiểm) khi nhận không?"}, {"cat": "Hỏi đáp", "title": "Bên shop thanh toán như thế nào?", "text": "Dạ COD, chuyển khoản, ví điện tử (Momo/ZaloPay), thẻ và trả góp 0% qua thẻ tín dụng cho đơn từ 3 triệu ạ.", "tags": "Bên shop thanh toán như thế nào?"}, {"cat": "Hỏi đáp", "title": "Giày này có phải chính hãng không? Sao rẻ hơn chỗ khác?", "text": "Dạ shop nhập chính ngạch/đại lý ủy quyền nên được giá tốt, có tem và bill đầy đủ. Nếu giá thấp hơn thị trường quá nhiều (dưới 50% giá niêm yết) thì mới đáng nghi ngờ, còn chênh 10–20% là chuyện bình thường do đợt sale/nhập sỉ ạ.", "tags": "Giày này có phải chính hãng không? Sao rẻ hơn chỗ khác?"}, {"cat": "Hỏi đáp", "title": "Làm sao để biết hàng thật – hàng giả?", "text": "Dạ anh/chị check 3 thứ nhanh nhất: (1) tem/mã sản phẩm (Nike: xxxxxx-xxx, Adidas: ART/ID) phải khớp hộp và bill; (2) đường may, keo, mùi vật liệu; (3) mua ở shop có tên, có hóa đơn. Shop nhận check hộ miễn phí nếu anh/chị mua ở nơi khác ạ.", "tags": "Làm sao để biết hàng thật – hàng giả?"}, {"cat": "Hỏi đáp", "title": "Có giày cho chân bè không?", "text": "Dạ có ạ. New Balance có size bề ngang 2E/4E (tốt nhất cho chân bè), ngoài ra Asics/Mizuno form châu Á rộng mũi, Air Force 1 cũng rộng. Anh/chị cho em số cm chân, em lọc đúng mẫu luôn nhé.", "tags": "Có giày cho chân bè không?"}, {"cat": "Hỏi đáp", "title": "Giày thể thao đi làm văn phòng được không?", "text": "Dạ hoàn toàn được, xu hướng 2026 là sneaker tối giản (da trắng, không logo to) đi làm rất lịch sự: kiểu AF1 trắng, NB 550, veja/Stan Smith, loafer-sneaker. Anh/chị muốn em gợi ý 3 mẫu dưới 2 triệu không ạ?", "tags": "Giày thể thao đi làm văn phòng được không?"}, {"cat": "Hỏi đáp", "title": "Giày bao lâu thì thay mới?", "text": "Dạ tùy cường độ: đi làm hằng ngày 1.5–2 năm; chạy bộ nên thay sau 600–800km (khoảng 1–1.5 năm với 20km/tuần). Dấu hiệu nên thay: đế mòn lệch, foam hết hồi, đau gót/chân khi đi lại mẫu quen thuộc.", "tags": "Giày bao lâu thì thay mới?"}, {"cat": "Hỏi đáp", "title": "Giày cũ có được thu đổi không?", "text": "Dạ shop có chương trình 'đổi giày cũ – giảm 10%': mang giày cũ (bất kỳ hãng, bất kỳ tình trạng) đến shop để được giảm 10% khi mua đôi mới, giày cũ được trao tặng cho chương trình từ thiện ạ.", "tags": "Giày cũ có được thu đổi không?"}, {"cat": "Hỏi đáp", "title": "Đặt trước giày hết hàng được không?", "text": "Dạ được ạ, đặt cọc 200k, hàng về trong 7–14 ngày tùy mẫu. Nếu hàng không về được, shop hoàn cọc 100% nhé.", "tags": "Đặt trước giày hết hàng được không?"}, {"cat": "Hỏi đáp", "title": "Shop có bán giày cho size lớn (46–48) không?", "text": "Dạ có ạ nhưng tồn kho ít. Anh/chị cho em biết mẫu + size để em kiểm tra kho, chưa có em đặt nhập về trong 7–10 ngày nhé. New Balance/Asics thường có size lớn tốt hơn Nike.", "tags": "Shop có bán giày cho size lớn (46–48) không?"}, {"cat": "Hỏi đáp", "title": "Có giày nữ size 39–41 không?", "text": "Dạ có ạ, nhiều mẫu unisex lấy size nam tương ứng (nữ 40 ≈ nam 8.5). Chị cho em số cm chân để em quy đổi chuẩn nhất nhé.", "tags": "Có giày nữ size 39–41 không?"}, {"cat": "Hỏi đáp", "title": "Giày trắng có dễ bẩn vàng không?", "text": "Dạ giày trắng nên vệ sinh định kỳ 2 tuần/lần và PHƠI TRONG BÓNG MÂT, tránh nắng trực tiếp (nguyên nhân chính gây ố vàng). Dùng dung dịch vệ sinh pha loãng, tráng sạch, lót giấy trắng khi phơi. Shop tặng kèm xịt nano chống bám bẩn cho giày trắng nhé ạ.", "tags": "Giày trắng có dễ bẩn vàng không?"}, {"cat": "Hỏi đáp", "title": "Đi giày mới bị đau gót/chột chân thì sao?", "text": "Dạ giày da (Dr. Martens, boot) thường cần 1–2 tuần 'phá giày'. Mẹo: đi tất dày với máy sấy tóc sấy nhẹ phần da gót, dùng gót dán/silicon dán gót, đến shop để nong miễn phí. Nếu đau kéo dài quá 2 tuần, anh/chị mang qua shop kiểm tra giúp em nhé.", "tags": "Đi giày mới bị đau gót/chột chân thì sao?"}, {"cat": "Hỏi đáp", "title": "Giày bị hôi chân xử lý thế nào?", "text": "Dạ anh/chị: (1) lót giày bỏ ra phơi khô; (2) rắc baking soda hoặc gói trà khô/túi than trong giày qua đêm; (3) dùng xịt khử mùi chuyên dụng; (4) luân phiên 2 đôi để giày khô hoàn toàn. Nếu lót cao su bị mùi lâu, thay lót mới (shop có lót than tre 80k).", "tags": "Giày bị hôi chân xử lý thế nào?"}, {"cat": "Hỏi đáp", "title": "Giày tăng size theo thời gian không?", "text": "Dạ giày da/da lộn sẽ 'giãn' theo chân khoảng 0.25–0.5 size sau vài tuần; vải canvas giãn nhẹ; giày thể thao tổng hợp gần như giãn không đáng kể. Nên mua vừa khít thoải mái, không mua nhỏ để 'nó giãn ra' nhé ạ.", "tags": "Giày tăng size theo thời gian không?"}, {"cat": "Hỏi đáp", "title": "Hàng thanh lý/outlet có phải hàng giả không?", "text": "Dạ không nhất thiết. Outlet là hàng chính hãng của mùa cũ, hàng lỗi nhẹ hoặc size lẻ → giá rẻ hơn. Nhưng nếu outlet bán giá quá thấp cho mẫu đang hot (ví dụ AF1 800k, Chunky 500k) thì gần như không phải hàng thật ạ.", "tags": "Hàng thanh lý/outlet có phải hàng giả không?"}, {"cat": "Hỏi đáp", "title": "Có nhận check giày giúp khách không?", "text": "Dạ có ạ. Anh/chị gửi ảnh: tem/size, lưỡi gà, đế, hộp và bill; em xem và tư vấn các điểm cần lưu ý. Shop nói rõ: check qua ảnh chỉ khoảng 80%, muốn chắc nhất cần cầm trực tiếp ạ.", "tags": "Có nhận check giày giúp khách không?"}, {"cat": "Hỏi đáp", "title": "Vì sao cùng đôi giày mà mỗi nơi bán giá khác nhau?", "text": "Dạ do nguồn nhập, đợt sale, size hot/chậm và phí vận chuyển khác nhau ạ. Chênh 10–20% là bình thường; chênh 40–50% thì nên xem lại tem/mã sản phẩm.", "tags": "Vì sao cùng đôi giày mà mỗi nơi bán giá khác nhau?"}, {"cat": "Hỏi đáp", "title": "Giày nam và nữ có khác nhau về công nghệ không?", "text": "Dạ thường cùng công nghệ, chỉ khác form (nữ thường hẹp hơn, đệm mỏng hơn nhẹ) và size. Một số mẫu nữ dùng đế/foam mỏng hơn bản nam để nhẹ chân. Về unisex, chỉ cần quy đổi size nam ↔ nữ (lệch 1.5) ạ.", "tags": "Giày nam và nữ có khác nhau về công nghệ không?"}, {"cat": "Hỏi đáp", "title": "Sản phẩm có phải hàng 1:1, rep không?", "text": "Dạ không ạ. Bên shop chỉ bán hàng chính hãng. Những khái niệm rep/1:1/siêu cấp đều là giày SAO CHÉP, không có nguồn gốc chính hãng; giá rẻ nhưng vật liệu, keo và độ bền kém hơn nhiều và dễ hỏng đế sau 6–12 tháng ạ.", "tags": "Sản phẩm có phải hàng 1:1, rep không?"}, {"cat": "Hỏi đáp", "title": "Vì sao giày chạy bộ đắt hơn giày thường?", "text": "Dạ giày chạy dùng foam công nghệ cao (ZoomX, Lightstrike Pro, FF BLAST), thiết kế cho quãng đường dài, nghiên cứu dáng chạy. Giày chạy race (Vaporfly, Adios Pro) còn có tấm carbon — đó là lý do giá 5–8 triệu. Nếu chỉ đi bộ, không cần mua tầm đó ạ.", "tags": "Vì sao giày chạy bộ đắt hơn giày thường?"}, {"cat": "Vệ sinh", "title": "Vệ sinh giày da thật", "text": "• Lau bằng khăn ẩm mềm, KHÔNG ngâm nước; dùng dung dịch vệ sinh da chuyên dụng, tránh cồn/acetone.\n• Vết bẩn mới: tẩy ngay bằng khăn ẩm + chút dầu gội em bé pha nước.\n• Dưỡng da (conditioner) mỗi 2–3 tháng để da không khô nứt; đánh xi giữ màu với giày tối màu.\n• Phơi trong bóng mát, nhồi giấy báo/cây giữ form; tránh nắng trực tiếp và máy sấy.", "tags": "vệ sinh bảo quản da thật cách làm sạch"}, {"cat": "Vệ sinh", "title": "Vệ sinh giày da lộn / suede", "text": "• KHÔNG dùng nước/nước rửa phổ thông; dùng bàn chải cao su chuyên da lộn để hết bụi (chải theo 1 chiều).\n• Vết bẩn: cục tẩy da lộn hoặc hỗn hợp giấm trắng + nước (1:1) chấm nhẹ, để khô tự nhiên rồi chải lại.\n• Phủ xịt nano/protector ngay khi mua mới và phủ lại 1–2 tháng/lần — giảm 80% vấn đề.\n• Gặp mưa: để khô tự nhiên (không sấy), nhồi giấy giữ form, chải lại khi khô.", "tags": "vệ sinh bảo quản da lộn / suede cách làm sạch"}, {"cat": "Vệ sinh", "title": "Vệ sinh giày vải canvas", "text": "• Có thể giặt tay nhẹ với bột giặt pha loãng + bàn chải mềm; KHÔNG vắt xoắn, không máy giặt.\n• Vết bẩn cứng đầu: baking soda + nước chấm lên, để 10 phút rồi chải.\n• Vải trắng: sau khi giặt, tráng sạch hết xà phòng (cặn xà phòng chính là thứ gây ố vàng), bọc giấy trắng kín mặt vải khi phơi.\n• Phơi nơi thoáng mát; nhét giấy báo giữ form. Tránh phơi nắng gắt làm vải cứng và ngả vàng.", "tags": "vệ sinh bảo quản vải canvas cách làm sạch"}, {"cat": "Vệ sinh", "title": "Vệ sinh giày lưới / mesh / knit", "text": "• Dùng bàn chải mềm + nước ấm pha xà phòng nhẹ, lau cục bộ rồi thấm khô; không chà mạnh vì dễ xước sợi.\n• Máy giặt: KHÔNG khuyến khích; nếu bắt buộc thì cho vào túi lưới, nước lạnh, chu trình nhẹ — sẽ giảm tuổi thọ keo.\n• Khử mùi: phơi thoáng + gói than/trà; thay lót giày định kỳ 6–12 tháng.", "tags": "vệ sinh bảo quản lưới / mesh / knit cách làm sạch"}, {"cat": "Vệ sinh", "title": "Vệ sinh giày cao su / EVA", "text": "• Rửa nước trực tiếp được: xà phòng nhẹ + bàn chải, sau đó lau khô, tránh phơi nắng lâu (EVA biến dạng/ngả vàng).\n• Vết bẩn bám: cục tẩy hoặc cồn lau nhẹ với đế cao su trắng.\n• Đế bị vàng: dùng kem đánh răng trắng/whitening hoặc gel tẩy trắng đế — hạn chế nắng để không vàng thêm.", "tags": "vệ sinh bảo quản cao su / EVA cách làm sạch"}, {"cat": "Vệ sinh", "title": "Bao lâu nên vệ sinh giày một lần?", "text": "Dạ với giày đi hằng ngày: lau khô 2–3 ngày/lần, vệ sinh sâu 2-4 tuần/lần; giày trắng nên vệ sinh 2 tuần/lần. Giày da thì lau + dưỡng mỗi tháng là đủ ạ.", "tags": "vệ sinh Bao lâu nên vệ sinh giày một lần?"}, {"cat": "Vệ sinh", "title": "Giày bị ố vàng ở đế thì xử lý sao?", "text": "Dạ do oxy hóa foam/cao su. Anh/chị dùng kem đánh răng trắng + bàn chải đánh nhẹ; nặng hơn thì dùng gel tẩy trắng chuyên dụng, phơi trong bóng mát. Quan trọng là PHÒNG trước: tránh nắng trực tiếp, lau khô ngay sau khi dính nước bẩn ạ.", "tags": "vệ sinh Giày bị ố vàng ở đế thì xử lý sao?"}, {"cat": "Vệ sinh", "title": "Giày bị bong keo thì dán lại được không?", "text": "Dạ được ạ. Bên shop dán keo miễn phí trong 6 tháng bảo hành; nếu do dùng quá lâu, anh/chị có thể dùng keo dính giày chuyên dụng (Barge/Đức-keo 502 loại dẻo) — nhớ làm sạch bề mặt, ép chặt 12 giờ. Không dùng keo 502 thường vì giòn, sẽ bong lại ạ.", "tags": "vệ sinh Giày bị bong keo thì dán lại được không?"}, {"cat": "Vệ sinh", "title": "Giày đi mưa về thì xử lý thế nào?", "text": "Dạ: (1) nhét giấy báo/khăn vào trong giày để hút ẩm và giữ form; (2) để khô tự nhiên nơi thoáng mát, KHÔNG hơ máy sấy/nắng nóng (da sẽ nứt, keo bong); (3) khi khô thì vệ sinh, xịt nano/chống thấm; (4) nếu ngâm nước lâu, sau khi khô xử lý khử mùi.", "tags": "vệ sinh Giày đi mưa về thì xử lý thế nào?"}, {"cat": "Vệ sinh", "title": "Giày bị mốc thì làm sao?", "text": "Dạ dùng khăn ẩm pha giấm trắng lau sạch mốc (làm ngoài trời), rồi bôi chút dầu/miếng dưỡng da; phơi nơi khô thoáng có nắng nhẹ sớm. Mốc quay lại nếu để ẩm — cho túi hút ẩm vào tủ giày nhé ạ.", "tags": "vệ sinh Giày bị mốc thì làm sao?"}, {"cat": "Vệ sinh", "title": "Giữ form giày như thế nào?", "text": "Dạ: nhét cây giữ form (shoe tree) hoặc giấy báo khi không dùng; không chồng giày lên nhau; tủ thoáng, có gói hút ẩm. Giày da nên kê cây nắp ngang để form không bẹp ạ.", "tags": "vệ sinh Giữ form giày như thế nào?"}, {"cat": "Vệ sinh", "title": "Dây giày trắng bị bẩn giặt thế nào?", "text": "Dạ tháo dây, ngâm nước ấm + bột giặt 15 phút, chà nhẹ, có thể ngâm thêm với baking soda; không dùng thuốc tẩy mạnh với dây màu. Dây trắng bẩn cứng đầu thì thay dây mới — shop có dây các màu 30–50k ạ.", "tags": "vệ sinh Dây giày trắng bị bẩn giặt thế nào?"}, {"cat": "Vệ sinh", "title": "Lót giày (insole) có nên giặt không?", "text": "Dạ lót bẩn/mùi thì GIẶT TAY nhẹ với xà phòng, không máy giặt; phơi khô hoàn toàn mới lắp lại. Lót cao su nhanh mùi thì nên thay mới mỗi 6–12 tháng — shop có lót than tre/orthopedic 80–150k ạ.", "tags": "vệ sinh Lót giày (insole) có nên giặt không?"}, {"cat": "Vệ sinh", "title": "Có nên dùng xịt nano/phủ chống thấm không?", "text": "Dạ CÓ, hiệu quả rõ nhất với da lộn, canvas và giày trắng. Cách dùng: xịt khi giày sạch, khô, cách 20cm, xịt 2 lớp mỏng đều, để khô 24 giờ; phủ lại sau 4–6 tuần (tùy tần suất đi). Lưu ý: xịt nano không thay thế vệ sinh định kỳ ạ.", "tags": "vệ sinh Có nên dùng xịt nano/phủ chống thấm không?"}, {"cat": "Vệ sinh", "title": "Đế giày bị mòn lệch thì xử lý sao?", "text": "Dạ mòn lệch (đặc biệt mép ngoài gót) là dấu hiệu nên thay giày nếu là giày chạy (trên 600–800km). Với giày thời trang, có thể dán đế/gò lại gót ở tiệm sửa giày (30–80k) để đi thêm 6–12 tháng ạ.", "tags": "vệ sinh Đế giày bị mòn lệch thì xử lý sao?"}, {"cat": "Check chính hãng", "title": "Quy trình check hàng chính hãng", "text": "• Nguyên tắc 1: HÀNG RẺ BẤT THƯỜNG = RỦI RO CAO. Giá dưới 50% giá niêm yết của mẫu mới đang hot gần như chắc chắn không phải hàng thật.\n• Nguyên tắc 2: Mua nơi có tên tuổi, hóa đơn, chính sách đổi trả. Không mua trôi nổi chỉ có 1–2 ảnh và giá 'sập sàn'.\n• Check tem & mã: mã sản phẩm trên tem (Nike: xxxxxx-xxx; Adidas: ART/ID; NB: Mxxxx) phải KHỚP giữa tem, hộp và hóa đơn.\n• Check đường may: hàng thật chỉ đều, mũi ngắn, không xộc xệch, không chỉ thừa kéo dài.\n• Check keo: viền keo thật mỏng, gọn, không tràn ra thành vệt vàng dày.\n• Check mùi & vật liệu: hàng thật ít mùi keo công nghiệp; da có vân tự nhiên, lưới dệt chắc.\n• Check đế: đế khối lượng khớp mô tả (Balenciaga to nặng, ZoomX nhẹ tênh), lót in size chuẩn, không lệch chữ.\n• Check hộp & phụ kiện: hộp/hộp dày chuẩn, giấy gói, túi bụi, thẻ hãng — nhiều fake bỏ qua phần này.\n• Dùng app/website: tra mã sản phẩm trên web hãng để so ảnh và ngày ra mắt; một số hãng có check serial.\n• Yếu tố cuối: NHỜ CHECK 3 NGUỒN. Đến shop có kinh nghiệm cầm thử, so với đôi thật — 'cảm giác cầm trên tay' quan trọng không kém thông tin.", "tags": "quy trình check real fake chính hãng dấu hiệu cảnh báo tem mã"}, {"cat": "Xu hướng", "title": "Xu hướng giày 2026", "text": "• Sneaker tối giản 'quiet luxury' lên ngôi: ton-sur-ton trắng/kem/xám, ít logo to, da mịn — đi làm và đi tiệc nhẹ đều được.\n• Trào lưu Retro/Nostalgia 80s–90s tiếp tục: Samba, Gazelle, Campus 00s, NB 550/530, Dunk tái sinh mạnh ở Gen Z; sneaker 'dày cổ điển' như 9060, Vomero 5 cũng hot.\n• Y2K chunky vẫn sống nhưng 'mềm hơn': Hoka Clifton/Bondi, On Cloudmonster, NB 9060 — đế dày nhưng nhẹ, thay vì cứng kiểu Triple S.\n• Giày đế cao/đế bệ nữ (platform) tăng: Converse Run Star Motion, New Balance CT302, giày bệt đế dày phối jeans ống rộng.\n• Xu hướng bền vững: vật liệu tái chế (Primeblue, Re-Nylon, adidas Terrex), khách trẻ hỏi rõ nguồn gốc — nên nhấn mạnh khi tư vấn.\n• Da lộn (suede) và houndstooth/denim texture 'lên ngôi' mùa lạnh; giày lông/lined (giày lông) bán rất chạy cuối năm.\n• Loafer & Mary Jane 'jelly' cho nữ, sneaker nam mũi gọn (low-profile) cho dân văn phòng trẻ.\n• Xu hướng 'giày cũ giá mới': các bản 'vintage wash' — Golden Goose, Nike 'vintage' Dunk low — khách trẻ chuộng.", "tags": "xu hướng hot trend bán chạy 2026 mẫu hot"}, {"cat": "So sánh", "title": "Nike Air Force 1 vs Nike Dunk Low", "text": "Cùng tầm giá 2–3 triệu, đều là sneaker biểu tượng. AF1: đế Air êm hơn, form rộng rãi thích hợp chân bè, 'bền hơn' khi đi nhiều; hơi nặng. Dunk: gọn gàng hơn, form hẹp ngang và mũi thấp → chân bè nên +0.5 size, phù hợp phối đồ slim/skate. Cần êm + bền → AF1; cần form gọn trendy → Dunk.", "tags": "Nike Air Force 1 Nike Dunk Low nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Adidas Samba OG vs Adidas Gazelle", "text": "Samba (1950) đế gum mỏng, mũi dài, hơi hẹp ngang; Gazelle đế gum nhưng thân da lộn mềm hơn, form rộng hơn Samba một chút. Cùng 2–2.8 triệu. Samba hợp phối âu phục/skool; Gazelle hợp chân bè hơn và mềm chân hơn.", "tags": "Adidas Samba OG Adidas Gazelle nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Adidas Ultraboost vs Nike Pegasus", "text": "Khác mục đích: Ultraboost (3.5–5 triệu) là giày đi bộ/đứng nhiều với Boost cực êm, thân Primeknit ôm như tất — hợp đi làm, đi chơi. Pegasus (3.1–4.5 triệu) là giày chạy bộ: nhẹ hơn, đệm Zoom Air đàn hồi, thoáng hơn. Đi bộ êm → Ultraboost; chạy thật sự → Pegasus.", "tags": "Adidas Ultraboost Nike Pegasus nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Converse Chuck 70 vs Vans Old Skool", "text": "Chuck 70: canvas dày, đế cao su dày êm hơn All Star, cổ cao, retro. Old Skool: da lộn + đế waffle bám hơn, form ôm và thấp hơn. Cùng 1.6–2.5 triệu. Đi bộ nhiều: Chuck 70 êm hơn chút; bám tốt/cân bằng: Old Skool. Cả hai đều đi dài 0.5 size — nên chọn nhỏ hơn nửa size.", "tags": "Converse Chuck 70 Vans Old Skool nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Asics Gel-Kayano vs Asics Gel-Nimbus", "text": "Cùng đệm GEL và giá 3.8–5 triệu. Kayano: dòng ỔN ĐỊNH (hỗ trợ chân bẹt/lật vào, có 4D Guidance). Nimbus: dòng ÊM TỐI ĐA cho chân bình thường/vòm cao. Chọn theo chân: bẹt/đau gối → Kayano; vòm cao/cần êm → Nimbus.", "tags": "Asics Gel-Kayano Asics Gel-Nimbus nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Hoka Clifton vs Hoka Bondi", "text": "Bondi: đệm dày nhất nhóm, êm tối đa, hơi nặng — hợp đứng lâu, đi bộ nhiều, khớp nhạy cảm. Clifton: nhẹ hơn, đệm vẫn êm nhưng 'sống động' hơn, hợp chạy hàng ngày. Cùng 3.9–5.5 triệu. Chỉ đi bộ/đứng → Bondi; vừa đi vừa chạy → Clifton.", "tags": "Hoka Clifton Hoka Bondi nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Biti's Hunter X vs Skechers GOwalk", "text": "Cùng nhóm đi bộ êm giá rẻ. Hunter X: nhẹ (~204g), đế Phylon đàn hồi, giá 700k–1.1 triệu, form trẻ. GOwalk: đệm Memory Foam mềm, giá 1.2–2 triệu, hợp người lớn tuổi, đứng nhiều. Ngân sách <1 triệu → Hunter X; cần êm tối đa cho chân nhạy → GOwalk.", "tags": "Biti's Hunter X Skechers GOwalk nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Ananas Basas vs Converse Chuck Taylor All Star", "text": "Cùng form canvas retro. Basas: đế lưu hoá dày, êm hơn, giá 500–800k, đế không dễ bong keo. Chuck: nhận diện quốc tế, đế mỏng hơn (bản All Star thường), giá 1.2–1.8 triệu. Muốn tiết kiệm + đi bộ ổn → Basas; cần thương hiệu quốc tế → Chuck.", "tags": "Ananas Basas Converse Chuck Taylor All Star nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "New Balance 530 vs New Balance 574", "text": "Đều là 'giày quốc dân' NB. 530: form 'dad shoes' ôm vừa, đế ABZORB êm, màu sáng, hợp phối đồ năng động. 574: cổ điển hơn, đế ENCAP bền, form tròn, hợp đi làm. Cùng 1.8–2.5 triệu. Trẻ/casual → 530; chín/công sở → 574.", "tags": "New Balance 530 New Balance 574 nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Crocs Classic vs Birkenstock Arizona", "text": "Crocs: EVA nhẹ 1–1.6 triệu, đi mưa/đi biển tốt, rửa nước được, êm nhẹ. Arizona: đế cork định hình vòm (2–4 triệu), hỗ trợ chân tốt hơn nhiều, cần 1–2 tuần làm quen, không ngâm nước. Cần nhẹ-rẻ-trời mưa → Crocs; cần nâng vòm/đau gót → Arizona.", "tags": "Crocs Classic Birkenstock Arizona nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Dr. Martens 1460 vs Timberland 6-inch", "text": "Cùng boot da nổi. 1460: cổ cao 8 lỗ, đế AirWair, phong cách rock/punk, đi mưa được, giá 3.5–5 triệu, đau gót tuần đầu. Timberland: nubuck chống nước, đế lug bám địa hình, ấm, giá 3.5–5 triệu. Đi phố/style → 1460; đi rừng/mùa lạnh/địa hình → Timberland.", "tags": "Dr. Martens 1460 Timberland 6-inch nên mua cái nào so sánh khác nhau"}, {"cat": "So sánh", "title": "Alexander McQueen Oversized vs Golden Goose Super-Star", "text": "Cùng nhóm luxury sneaker 12–18 triệu. McQueen: đế platform dày, tôn chiều cao, da trắng tinh khôi, hợp chụp ảnh. Golden Goose: đế 'bẩn' cố ý, mềm chân hơn, phong cách lived-in. Thích nổi bật/cao ráo → McQueen; thích 'cũ nhưng sang' → Golden Goose.", "tags": "Alexander McQueen Oversized Golden Goose Super-Star nên mua cái nào so sánh khác nhau"}, {"cat": "Tình huống bán hàng", "title": "Khách hỏi mua giày dưới 1 triệu", "text": "Đừng đẩy mẫu đắt ngay. Gợi ý trong tầm: Biti's Hunter (~700k–1.1 triệu), dép Biti's, giày vải Thượng Đình/Ananas sale, giày basic nữ Juno. Nhấn: 'Trong tầm này Biti's Hunter là êm nhất, đế đàn hồi, phù hợp đi học cả ngày.' Nếu khách mặc đẹp hơn, mở comment 'chỉ thêm 300k là có Ananas đế lưu hoá bền hơn hẳn' để nâng nhẹ giá trị đơn.", "tags": "Khách hỏi mua giày dưới 1 triệu xử lý tư vấn khách"}, {"cat": "Tình huống bán hàng", "title": "Khách phân vân giữa hai mẫu cùng tầm giá", "text": "Hỏi đúng 3 câu: đi hàng ngày hay dịp gì? chân có bè/đau gót không? phối đồ gì nhiều? Rồi tư vấn theo ma trận: êm+bền→A, form gọn+trend→B. Cho khách thử cả hai cùng lúc và so sánh trực tiếp, đó là cách chốt nhanh nhất.", "tags": "Khách phân vân giữa hai mẫu cùng tầm giá xử lý tư vấn khách"}, {"cat": "Tình huống bán hàng", "title": "Khách chê 'đắt quá, shop khác rẻ hơn'", "text": "Xác nhận cảm nhận ('Dạ em hiểu, giá cũng là chuyện lớn ạ'), rồi mở giá trị: chính hãng có bill/check mã, bảo hành keo-đế 6 tháng, đổi size miễn phí, hỗ trợ vệ sinh. Nếu vẫn còn chênh lệch nhỏ, mời khách nhận quà nhỏ (xịt nano/dây giày) để chốt. Không hạ giá bằng mọi giá — giữ mặt bằng chung.", "tags": "Khách chê 'đắt quá, shop khác rẻ hơn' xử lý tư vấn khách"}, {"cat": "Tình huống bán hàng", "title": "Khách hỏi giày cho người đứng nhiều (bảo vệ, phục vụ, bệnh viện)", "text": "Ưu tiên đệm êm + nh /* ---------- công cụ tìm kiếm từ khoá (tiếng Việt) ---------- */
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
const STOP = new Set(['la','cua','gi','thi','co','khong','cho','em','minh','shop','a','va','hay','nen','mua','muon',
  'hoi','can','duoc','bao','nhieu','the','nao','o','dau','k','nhu','voi','cac','nhung','mot','doi','giay','giup',
  'vay','toi','ban','xin','cam','on','ad','nha','ve','lai','ra','vao','khi','de','nay','kia','do','ma','bang','lam',
  'gia','tam','khoang']);
function tok(s){return norm(s).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>1 && !STOP.has(w));}

const df = {};
DOCS.forEach(d=>{
  d._t = new Set(tok(d.title+' '+d.text+' '+d.tags));
  d._title = tok(d.title);
  const all = (d.title+' '+d.text+' '+d.tags);
  d._raw = all.toLowerCase();
  d._nums = (all.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
});
DOCS.forEach(d=>{ d._t.forEach(w=>df[w]=(df[w]||0)+1); });
const N = DOCS.length;
const idf = w => Math.log(1 + N/(1+(df[w]||0)));

function search(q, k=3){
  const qt = tok(q);
  if(!qt.length) return [];
  const sc = DOCS.map(d=>{
    let s=0, hit=0;
    qt.forEach(w=>{
      if(d._t.has(w)){ s += idf(w); hit++; }
      else if([...d._t].some(x=>x.startsWith(w) && w.length>=4)){ s += idf(w)*0.6; hit+=0.6; }
    });
    d._title.forEach(w=>{ if(qt.includes(w)) s += idf(w)*0.8; });
    const phrase = norm(q);
    if(phrase.length>8 && norm(d.title).includes(phrase)) s += 3;
    // khớp số liệu (cm, size) – ví dụ "chân 25cm" khớp mục "Chân 25.4 cm"
    const qraw = q.toLowerCase();
    qraw.split(/\s+/).forEach(w=>{
      // bỏ ký tự dấu câu ở hai đầu – không dùng regex Unicode để tương thích mọi trình duyệt
      let a=0, b=w.length;
      const isChar = ch => (ch.toLowerCase()!==ch.toUpperCase()) || (ch>='0'&&ch<='9');
      while(a<b && !isChar(w[a])) a++;
      while(b>a && !isChar(w[b-1])) b--;
      w = w.slice(a,b);
      if(w.length>=2 && d._raw.includes(w)) s += 1.2;
    });
    qt.forEach(w=>{
      const m = w.match(/^(\d+(?:[.,]\d+)?)(cm|mm)?$/);
      if(!m) return;
      const v = parseFloat(m[1].replace(',','.'));
      if(isNaN(v)) return;
      d._nums.forEach(n=>{
        if(Math.abs(n-v) <= 0.25){ s += 2.6; hit++; }
        else if(Math.abs(n-v) <= 0.6){ s += 1.0; hit++; }
      });
    });
    return {d, s, hit};
  }).filter(x=>x.hit>0).sort((a,b)=>b.s-a.s);
  return sc.slice(0,k);
}

function bubble(text, who, tag){
  const div=document.createElement('div');
  div.className='msg '+(who==='me'?'me':'bot');
  if(tag){const t=document.createElement('div'); t.className='tag'; t.textContent=tag; div.appendChild(t);}
  const body=document.createElement('div'); body.textContent=text; div.appendChild(body);
  log.appendChild(div); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

  const inp=document.getElementById('q'); const q=inp.value.trim(); if(!q) return;
  bubble(q,'me'); inp.value='';
  const res=search(q,3);
  if(!res.length){
    bubble("Dạ em chưa tìm thấy dữ liệu cho câu này. Anh/chị thử hỏi theo từ khoá khác – ví dụ: 'Nike nguồn gốc', 'Samba giá', 'size chân bè', 'check Adidas fake', 'vệ sinh da lộn', 'chân bẹt giày gì' ạ.", 'bot');
    return;
  }
  const top=res[0];
  let out=top.d.text;
  if(res.length>1){
    const rel=res.slice(1).map(r=>'• '+r.d.title).join('\n');
    out+='\n\n📎 Xem thêm:\n'+rel;
  }
  bubble(out,'bot', top.d.cat+' · '+top.d.title);
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
