<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShoeBot Offline – Tra cứu nhanh các hãng giày</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#242833;--txt:#e8ecf3;--muted:#93a0b4;--accent:#4da3ff;--accent2:#1f6feb}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#0f1115,#12161d 60%);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:18px 14px 90px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7b61ff);
        display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:19px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 12px;
        border-radius:999px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  #log{display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5;font-size:14.5px}
  .me{align-self:flex-end;background:var(--accent2);border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
       padding:1px 7px;border-radius:999px;margin-bottom:6px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#0f1115ee;border-top:1px solid var(--line);
       padding:10px 14px;backdrop-filter:blur(6px)}
  .barInner{max-width:900px;margin:0 auto;display:flex;gap:8px}
  input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt);
        padding:12px 14px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  button.go{background:var(--accent2);border:none;color:#fff;padding:12px 18px;border-radius:12px;
            font-size:15px;cursor:pointer;font-weight:600}
  .hint{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
  a{color:var(--accent)}
</style>
</head>

ush nếu đi nhiều\n• Da lộn cần chăm kỹ khi trời mưa", "tags": "Vans có tốt không nên mua"}, {"cat": "Size", "title": "Vans – form & chọn size", "text": "Classic (Old Skool/Authentic/Era) chạy dài ~0.5 size → giảm 0.5 nếu chân thon; chân bè giữ đúng size. Knu Skool rộng hơn.", "tags": "Vans size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Vans – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 'VANS' ở gót và đế in nét, đúng font; sọc jazz stripe cong chuẩn tỷ lệ\n• Tem lưỡi đỏ/trắng in rõ mã sản phẩm (VN000...) khớp hộp\n• Đế waffle vân sâu đều, có chữ 'VANS' + 'OFF THE WALL' ở giữa đế\n• Vải canvas dày, mũi may đều; lót có logo in chìm nhẹ", "tags": "Vans check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Old Skool (Vans)", "text": "Đôi đầu tiên có sọc jazz stripe; da lộn + canvas; biểu tượng streetwear mọi thế hệ.\n• Ra mắt khoảng: 1977\n• Giá tham khảo: ≈ 1.6–2.1 triệu\n• Form/size: Đi dài nhẹ & ôm ngang → nhiều người giảm 0.5\n• Phù hợp: Đi học, đi chơi, phối jeans/quần tây", "tags": "Old Skool giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Sk8-Hi (Vans)", "text": "Cổ cao bảo vệ mắt cá chân, phối được với đồ thu đông.\n• Ra mắt khoảng: 1978\n• Giá tham khảo: ≈ 1.9–2.5 triệu\n• Form/size: Ôm cổ chân, chân bè +0.5\n• Phù hợp: Mix layer, thu đông, gu street", "tags": "Sk8-Hi giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Knu Skool (Vans)", "text": "Lưỡi gà dày 'phồng', form bầu bĩnh Y2K; hot Gen Z.\n• Ra mắt khoảng: 1997 (revive 2023)\n• Giá tham khảo: ≈ 2–2.6 triệu\n• Form/size: Rộng rãi hơn Old Skool\n• Phù hợp: Gu Y2K, ống rộng", "tags": "Knu Skool giá form phù hợp"}, {"cat": "Hãng", "title": "Fila – nguồn gốc & định vị", "text": "Fila là thương hiệu của Ý/Hàn Quốc (F&F Holdings nắm quyền toàn cầu từ 2021; thị trường VN gắn với Fila Korea), thành lập năm 1911. Người sáng lập: Anh em nhà Fila (Biella, Ý).\nĐịnh vị: Chunky retro: Disruptor đế dày từng làm mưa làm gió, hiện phổ biến trong trường học VN nhờ gi rm phù hợp"}, {"cat": "Hãng", "title": "Skechers – nguồn gốc & định vị", "text": "Skechers là thương hiệu của Mỹ, thành lập năm 1992. Người sáng lập: Robert Greenberg (California).\nĐịnh vị: Vua giày ĐI BỘ êm giá phải chăng: GOwalk, Arch Fit, Slip-ins (xỏ không cần cúi) — cực hợp người lớn tuổi, đứng nhiều..\nKhẩu hiệu: Comfort That Performs / 'It's the S' (marketing nội địa).\nKhách mục tiêu: Người lớn tuổi, khách đứng/đi bộ nhiều (y tá, giáo viên), khách mua cho bố mẹ, nhân viên phục vụ..", "tags": "Skechers skechers nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Skechers – khoảng giá", "text": "Khoảng giá sản phẩm Skechers: 1.2–2 triệu (GOwalk, Arch Fit); 1.6–2.4 triệu (Slip-ins); 2–3 triệu (Max Cushioning). Giá tham khảo. (tham khảo).", "tags": "Skechers giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Skechers – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• GOwalk (5, 6, 7): Giày đi bộ siêu nhẹ, đệm Memory Foam, co giãn; 'đi cả ngày không mỏi'.\n• Arch Fit: Lót đúc theo 20 năm dữ liệu bàn chân, hỗ trợ vòm — được chuyên gia chân khuyên dùng.\n• Slip-ins: Xỏ không cần tay, gót 'Hands Free'; rất tiện cho người già, người bận.", "tags": "Skechers dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Skechers – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Êm nhất phân khúc giá rẻ–trung\n• Arch Fit hữu ích cho chân bẹt\n• Slip-ins tiện lợi đặc biệt cho người già\nĐiểm cần biết:\n• Thời trang không nổi bật\n• Foam mềm nhanh 'xẹp' với người nặng cân đi liên tục", "tags": "Skechers có tốt không nên mua"}, {"cat": "Size", "title": "Skechers – form & chọn size", "text": "Form rộng rãi, đúng size là dùng được; người chân bè hầu như không cần lên size.", "tags": "Skechers size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Skechers – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 'S' khắc ở thân/đế nét chuẩn\n• Tem xanh/trắng in mã giày (ví dụ 216xxx) khớp hộp\n• Lót Memory Foam dày, in logo Skechers; hàng nhái thường lót mỏng", "tags": "Skechers check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "GOwalk (5, 6, 7) (Skechers)", "text": "Giày đi bộ siêu nhẹ, đệm Memory Foam, co giãn; 'đi cả ngày không mỏi'.\n• Ra mắt khoảng: 2012–nay\n• Giá tham khảo: ≈ 1.3–2 triệu\n• Form/size: Đúng size, form rộng\n• Phù hợp: Đi bộ, đứng nhiều, người lớn tuổi, đi du lịch", "tags": "GOwalk (5, 6, 7) giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Arch Fit (Skechers)", "text": "Lót đúc theo 20 năm dữ liệu bàn chân, hỗ trợ vòm — được chuyên gia chân khuyên dùng.\n• Ra mắt khoảng: 2020\n• Giá tham khảo: ≈ 1.6–2.4 triệu\n• Form/size: Đúng size\n• Phù hợp: Chân bẹt nhẹ, đau vòm, viêm cân gan chân", "tags": "Arch Fit giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Slip-ins (Skechers)", "text": "Xỏ không cần tay, gót 'Hands Free'; rất tiện cho người già, người bận.\n• Ra mắt khoảng: 2022\n• Giá tham khảo: ≈ 1.7–2.4 triệu\n• Form/size: Đúng size\n• Phù hợp: Người lớn tuổi, phụ nữ mang thai, khách cần tiện", "tags": "Slip-ins giá form phù hợp"}, {"cat": "Hãng", "title": "Hoka (HOKA One One) – nguồn gốc & định vị", "text": "Hoka (HOKA One One) là thương hiệu của Pháp/Mỹ (sáng lập ở Annecy, Pháp; hiện trụ sở Mỹ, thuộc Deckers), thành lập năm 2009. Người sáng lập: Nicolas Mermoud & Jean-Luc Diard (dân trail Pháp).\nĐịnh vị: Tiên phong 'max cushion' đế dày: Bondi/Clifton là đôi đi bộ êm nhất phân khúc; được y tá, người đứng lâu và runner khắp thế giới ưa chuộng..\nKhẩu hiệu: Time to Fly..\nKhách mục tiêu: Nhân viên y tế, người đứng lâu, người lớn tuổi, runner, dân hiking; khách 'gu mới' chuyển từ Nike/Adidas..", "tags": "Hoka (HOKA One One) hoka nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Hoka (HOKA One One) – khoảng giá", "text": "Khoảng giá sản phẩm Hoka (HOKA One One): 3.2–4.2 triệu (Clifton, Arahi); 4.2–5.5 triệu (Bondi, Speedgoat); 5–6.5 triệu (Rocket X, Mach X). Giá tham khảo. (tham khảo).", "tags": "Hoka (HOKA One One) giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Hoka (HOKA One One) – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Bondi 8/9: Đệm dày nhất nhóm phổ thông: êm tối đa cho đứng lâu, đi bộ cả ngày; hơi cao nên cần 1–2 tuần làm quen.\n• Clifton 9/10: Nhẹ hơn Bondi nhưng vẫn êm, 'daily trainer' được đánh giá cao nhất phân khúc đế dày.\n• Arahi 7/8: Giày ỔN ĐỊNH với J-Frame cho chân lật vào, đệm vẫn dày êm.\n• Speedgoat 5/6: Trail huyền thoại với đế Vibram bám cực tốt, đệm dày cho đường núi dài.", "tags": "Hoka (HOKA One One) dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Hoka (HOKA One One) – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Êm nhất phân khúc đứng nhiều/đi bộ\n• Meta-Rocker giúp đi bộ mượt, giảm mỏi\n• Vibram trên dòng trail rất bền\nĐiểm cần biết:\n• Đế dày gây cảm giác chông chênh lúc mới\n• Gu thời trang 'to bản' không hợp mọi người\n• Giá khá cao", "tags": "Hoka (HOKA One One) có tốt không nên mua"}, {"cat": "Size", "title": "Hoka (HOKA One One) – form & chọn size", "text": "Đúng size theo đa số phản hồi; đế dày nên đôi khi cần +0.5 nếu đi tất dày. Chân bè thường vẫn vừa Clifton/Bondi.", "tags": "Hoka (HOKA One One) size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Hoka (HOKA One One) – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 'HOKA' nét, in ở lưỡi/đế; chữ 'HOKA ONE ONE' không sai font\n• Tem size in mã kiểu (M10/W11 — dòng nữ quy đổi riêng) khớp hộp\n• Đế CMEVA mịn đồng nhất; hàng fake foam thường cứng và nặng hơn\n• Vải lưỡi mỏng nhẹ nhưng chắc, may đều", "tags": "Hoka (HOKA One One) check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Bondi 8/9 (Hoka (HOKA One One))", "text": "Đệm dày nhất nhóm phổ thông: êm tối đa cho đứng lâu, đi bộ cả ngày; hơi cao nên cần 1–2 tuần làm quen.\n• Ra mắt khoảng: 2023/2024\n• Giá tham khảo: ≈ 4.2–5.5 triệu\n• Form/size: Đúng size (TTS), mũi rộng vừa\n• Phù hợp: Đi bộ, đứng nhiều, khớp nhạy cảm, phục hồi", "tags": "Bondi 8/9 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Clifton 9/10 (Hoka (HOKA One One))", "text": "Nhẹ hơn Bondi nhưng vẫn êm, 'daily trainer' được đánh giá cao nhất phân khúc đế dày.\n• Ra mắt khoảng: 2023/2025\n• Giá tham khảo: ≈ 3.5–4.5 triệu\n• Form/size: Đúng size\n• Phù hợp: Chạy hàng ngày, đi bộ, đi làm thoải mái", "tags": "Clifton 9/10 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Arahi 7/8 (Hoka (HOKA One One))", "text": "Giày ỔN ĐỊNH với J-Frame cho chân lật vào, đệm vẫn dày êm.\n• Ra mắt khoảng: 2023/2025\n• Giá tham khảo: ≈ 3.9–4.8 triệu\n• Form/size: Đúng size\n• Phù hợp: Chân bẹt/chân lật vào nhẹ–vừa", "tags": "Arahi 7/8 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Speedgoat 5/6 (Hoka (HOKA One One))", "text": "Trail huyền thoại với đế Vibram bám cực tốt, đệm dày cho đường núi dài.\n• Ra mắt khoảng: 2024/2025\n• Giá tham khảo: ≈ 4.5–5.5 triệu\n• Form/size: Đúng size, nên +0.5 nếu chân bè\n• Phù hợp: Chạy trail, leo núi, địa hình đá", "tags": "Speedgoat 5/6 giá form phù hợp"}, {"cat": "Hãng", "title": "On (On Running) – nguồn gốc & định vị", "text": "On (On Running) là thương hiệu của Thụy Sĩ (Switzerland), thành lập năm 2010. Người sáng lập: Olivier Bernhard (cựu vô địch triathlon) cùng David Allemann & Caspar Coppetti.\nĐịnh vị: Thương hiệu chạy 'sang' nhất thập kỷ: CloudTec + Speedboard tạo cảm giác 'mây' đặc trưng; cực hot ở dân văn phòng & giới công nghệ..\nKhẩu hiệu: Dream On..\nKhách mục tiêu: Dân văn phòng, giới công nghệ, người thích 'êm mà vẫn lịch sự', khách nữ nhiều..", "tags": "On (On Running) on nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "On (On Running) – khoảng giá", "text": "Khoảng giá sản phẩm On (On Running): 3.3–4.5 triệu (Cloud 5, Cloudswift); 4.5–5.5 triệu (Cloudmonster, Cloudsurfer); 4–5 triệu (Cloudtilt). Giá tham khảo. (tham khảo).", "tags": "On (On Running) giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "On (On Running) – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Cloud 5 / Cloud 6: Đôi 'lịch sự nhất để đi làm': nhẹ, êm, thiết kế tối giản; nhưng đế Cloud dễ kẹt sỏi.\n• Cloudmonster 2: Bản đế to tối đa của On, êm hơn nhiều so với Cloud thường; hot như giày đi bộ 'chất'.\n• Cloudtilt: Lifestyle 'easy on/off', hợp đi làm hằng ngày; bán rất chạy ở VN (≈4.7 triệu).", "tags": "On (On Running) dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "On (On Running) – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Thiết kế đẹp, phù hợp cả đi làm lẫn tập luyện\n• Cảm giác bước rất êm đặc trưng\n• Ít đụng hàng, được coi là 'gu tốt'\nĐiểm cần biết:\n• Giá cao so với cấu hình\n• Đế Cloud kẹt sỏi/đá nhỏ, mòn nhanh nếu đi nhựa đường nhiều\n• Form nhỏ — nhiều khách mua sai size lần đầu", "tags": "On (On Running) có tốt không nên mua"}, {"cat": "Size", "title": "On (On Running) – form & chọn size", "text": "NHỎ HƠN SIZE CHUẨN — gần như chắc chắn nên tăng 0.5 size; chân bè có thể +0.5 tới 1 size. Đừng mua On như size Nike.", "tags": "On (On Running) size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "On (On Running) – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 'On' và chữ 'Swiss Engineering' in nét\n• Đế Cloud các ô tròn đều, không lệch méo\n• Tem size + mã model (ví dụ 59.98xxx) khớp hộp\n• Speedboard bên trong nhìn từ đế thấy tấm mờ đặc trưng", "tags": "On (On Running) check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Cloud 5 / Cloud 6 (On (On Running))", "text": "Đôi 'lịch sự nhất để đi làm': nhẹ, êm, thiết kế tối giản; nhưng đế Cloud dễ kẹt sỏi.\n• Ra mắt khoảng: 2022/2025\n• Giá tham khảo: ≈ 3.6–4.5 triệu\n• Form/size: HƠI NHỎ — nên tăng 0.5 size\n• Phù hợp: Đi làm, đi bộ thành phố, chạy nhẹ", "tags": "Cloud 5 / Cloud 6 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Cloudmonster 2 (On (On Running))", "text": "Bản đế to tối đa của On, êm hơn nhiều so với Cloud thường; hot như giày đi bộ 'chất'.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 4.7–5.5 triệu\n• Form/size: Hơi nhỏ, +0.5 size\n• Phù hợp: Đi bộ nhiều, gu chunky tinh tế", "tags": "Cloudmonster 2 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Cloudtilt (On (On Running))", "text": "Lifestyle 'easy on/off', hợp đi làm hằng ngày; bán rất chạy ở VN (≈4.7 triệu).\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 4.5–5.2 triệu\n• Form/size: +0.5 size\n• Phù hợp: Đi làm, đi chơi, mix smart-casual", "tags": "Cloudtilt giá form phù hợp"}, {"cat": "Hãng", "title": "Salomon – nguồn gốc & định vị", "text": "Salomon là thương hiệu của Pháp (Annecy; thuộc Amer Sports), thành lập năm 1947. Người sáng lập: Georges Salomon.\nĐịnh vị: Vua trail châu Âu + biểu tượng 'gorpcore': XT-6/XT-4 được mặc cả trên đường núi lẫn đường phố..\nKhẩu hiệu: Tomorrow Is Yours..\nKhách mục tiêu: Dân trail/hiking, giới trẻ theo gorpcore, dân du lịch bụi, khách mưa nhiều..", "tags": "Salomon salomon nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Salomon – khoảng giá", "text": "Khoảng giá sản phẩm Salomon: 3–4 triệu (Speedcross, RX); 4.5–6 triệu (XT-6, XT-4); GORE-TEX cao hơn 10–20%. Giá tham khảo. (tham khảo).", "tags": "Salomon giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Salomon – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• XT-6: Giày trail-tech thành mốt đường phố: form ôm, lưới kỹ thuật, Quicklace, màu tinh tế.\n• Speedcross 6: Đế gai sâu bám bùn đá tuyệt đối, chuẩn trail khô lẫn ẩm.\n• RX Moc / Slide: Dép 'phục hồi' sau chạy, êm và thời trang; hot mùa hè.", "tags": "Salomon dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Salomon – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Đế Contagrip bám tốt nhất phân khúc\n• Quicklace tiện lợi, không cần thắt\n• GORE-TEX giữ khô chân khi mưa\nĐiểm cần biết:\n• GORE-TEX kém thoáng, nóng chân mùa hè\n• Giá khá cao; một số dòng khó phối đồ 'văn phòng'", "tags": "Salomon có tốt không nên mua"}, {"cat": "Size", "title": "Salomon – form & chọn size", "text": "Đúng size nhưng form ôm — chân bè/dày nên +0.5. GORE-TEX cần chỗ cho tất dày → có thể +0.5.", "tags": "Salomon size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Salomon – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo Salomon in nét; Quicklace có logo ở đầu dây\n• Tem nâu/đen trong lưỡi có mã model (ví dụ L47xxx) khớp hộp\n• Đế Contagrip in chữ ở gót; gai đế đều và sắc\n• XT-6: đường may dày dặn, logo 'S' nhỏ ở mũi và gót", "tags": "Salomon check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "XT-6 (Salomon)", "text": "Giày trail-tech thành mốt đường phố: form ôm, lưới kỹ thuật, Quicklace, màu tinh tế.\n• Ra mắt khoảng: 2013 (hot lại 2020s)\n• Giá tham khảo: ≈ 4.7–6 triệu\n• Form/size: Ôm ngang — chân bè +0.5\n• Phù hợp: Đi chơi, gu gorpcore, đi phượt nhẹ", "tags": "XT-6 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Speedcross 6 (Salomon)", "text": "Đế gai sâu bám bùn đá tuyệt đối, chuẩn trail khô lẫn ẩm.\n• Ra mắt khoảng: 2023\n• Giá tham khảo: ≈ 3.5–4.5 triệu\n• Form/size: Đúng size, +0.5 nếu chân bè\n• Phù hợp: Chạy trail, trekking, địa hình xấu", "tags": "Speedcross 6 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "RX Moc / Slide (Salomon)", "text": "Dép 'phục hồi' sau chạy, êm và thời trang; hot mùa hè.\n• Ra mắt khoảng: 2021\n• Giá tham khảo: ≈ 2–3 triệu\n• Form/size: Đúng size theo cm\n• Phù hợp: Đi dạo, phục hồi sau tập", "tags": "RX Moc / Slide giá form phù hợp"}, {"cat": "Hãng", "title": "Brooks – nguồn gốc & định vị", "text": "Brooks là thương hiệu của Mỹ, thành lập năm 1914. Người sáng lập: Morris Goldenberg (Philadelphia).\nĐịnh vị: Chuyên gia giày chạy trăm năm: Ghost/Adrenaline là 'daily trainer' top của Mỹ; GuideRails là công nghệ ổn định êm nổi bật..\nKhẩu hiệu: Run Happy..\nKhách mục tiêu: Runner nghiêm túc, người chân bẹt, khách trung niên, người đi bộ đường dài..", "tags": "Brooks brooks nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Brooks – khoảng giá", "text": "Khoảng giá sản phẩm Brooks: 3–4 triệu (Ghost, Trace); 3.8–4.8 triệu (Adrenaline GTS, Glycerin). Giá tham khảo. (tham khảo).", "tags": "Brooks giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Brooks – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Ghost 16: Neutral daily: êm vừa phải, chắc chân, mũi rộng vừa; best-seller của Brooks toàn cầu.\n• Adrenaline GTS 24: ỔN ĐỊNH với GuideRails: hỗ trợ lật vào mà không cứng; được chuyên gia khuyên cho chân bẹt nhẹ–vừa.\n• Glycerin 22: Dòng êm tối đa với DNA Glycerin mới — được so là 'êm như Nimbus nhưng bền hơn'.", "tags": "Brooks dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Brooks – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• GuideRails hỗ trợ chân bẹt rất êm\n• Đệm bền thời gian dài\n• Gần như 'chuẩn vàng' daily trainer của dân chạy Mỹ\nĐiểm cần biết:\n• Một số mẫu bán ít tại VN, khó 'xem trực tiếp'\n• Gu thẩm mỹ trung tính, không hợp khách theo mốt", "tags": "Brooks có tốt không nên mua"}, {"cat": "Size", "title": "Brooks – form & chọn size", "text": "Đúng size hoặc hơi rộng; chân thon có thể giảm 0.5 với Ghost. Có bản bề ngang 2E với nhiều dòng.", "tags": "Brooks size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Brooks – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo Brooks nét, in ở thân và đế; tem lưỡi có mã (ví dụ 110xxx) khớp hộp\n• Đế DNA LOFT nhìn thấy lớp foam; hàng nhái thường lộ 'lỗ' foam\n• Lót in 'Brooks' + size hệ Mỹ chuẩn\n• Mũi giày có logo nhỏ ở mép ngoài", "tags": "Brooks check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Ghost 16 (Brooks)", "text": "Neutral daily: êm vừa phải, chắc chân, mũi rộng vừa; best-seller của Brooks toàn cầu.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 3.3–4.2 triệu\n• Form/size: Đúng size, form Mỹ hơi rộng\n• Phù hợp: Chạy hàng ngày, đi bộ thể thao", "tags": "Ghost 16 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Adrenaline GTS 24 (Brooks)", "text": "ỔN ĐỊNH với GuideRails: hỗ trợ lật vào mà không cứng; được chuyên gia khuyên cho chân bẹt nhẹ–vừa.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 3.8–4.6 triệu\n• Form/size: Đúng size\n• Phù hợp: Chân bẹt, đau gối khi chạy, đi bộ đường dài", "tags": "Adrenaline GTS 24 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Glycerin 22 (Brooks)", "text": "Dòng êm tối đa với DNA Glycerin mới — được so là 'êm như Nimbus nhưng bền hơn'.\n• Ra mắt khoảng: 2025\n• Giá tham khảo: ≈ 4.2–5.2 triệu\n• Form/size: Đúng size\n• Phù hợp: Đi bộ lâu, chạy chậm, khớp nhạy cảm", "tags": "Glycerin 22 giá form phù hợp"}, {"cat": "Hãng", "title": "Saucony – nguồn gốc & định vị", "text": "Saucony là thương hiệu của Mỹ, thành lập năm 1898. Người sáng lập: Vịnh Saucony Creek, Pennsylvania (ban đầu sản xuất cho thợ mỏ & giày trẻ em, chuyển sang giày chạy).\nĐịnh vị: Ẩn số chất lượng của làng chạy: Endorphin được giới runner khắp nơi đánh giá 'đáng tiền nhất' phân khúc tốc độ; phổ biến mạnh ở VN qua cộng đồng chạy..\nKhẩu hiệu: Run for Good..\nKhách mục tiêu: Runner có kinh nghiệm, thành viên CLB chạy, khách tìm 'giá trị thật' hơn thương hiệu..", "tags": "Saucony saucony nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Saucony – khoảng giá", "text": "Khoảng giá sản phẩm Saucony: 3–4 triệu (Ride, Guide); 3.5–4.5 triệu (Endorphin Speed); 4.5–6 triệu (Endorphin Pro, Triumph). Giá tham khảo. (tham khảo).", "tags": "Saucony giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Saucony – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Endorphin Speed 4: PWRRUN PB + tấm nylon: chạy tempo/interval rất 'nảy', được đánh giá tốt nhất phân khúc 4 triệu.\n• Kinvara 15: Nhẹ, đơn giản, nhanh nhẹn — giày 'true to its roots' cho runner muốn cảm giác mặt đường.\n• Triumph 22: Dòng êm tối đa, dày dặn, bền — đối trọng Nimbus/Glycerin.", "tags": "Saucony dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Saucony – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Endorphin dòng tốc độ đáng tiền\n• Nhiều mẫu bền hơn trung bình\n• Được cộng đồng chạy VN tin dùng\nĐiểm cần biết:\n• Nhận diện đại chúng thấp hơn Nike/Adidas/Asics\n• Một số mẫu khó mua đúng size ở VN", "tags": "Saucony có tốt không nên mua"}, {"cat": "Size", "title": "Saucony – form & chọn size", "text": "Đúng size; Endorphin hơi ôm → chân bè +0.5.", "tags": "Saucony size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Saucony – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 3 chấm 'saucony' ở thân; tem size/mã khớp hộp\n• Đế PWRRUN mịn, không có vân lạ; hàng nhái đế cứng hơn rõ\n• Lót in logo và tên dòng; may mũi giày đều", "tags": "Saucony check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Endorphin Speed 4 (Saucony)", "text": "PWRRUN PB + tấm nylon: chạy tempo/interval rất 'nảy', được đánh giá tốt nhất phân khúc 4 triệu.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 3.9–4.9 triệu\n• Form/size: Đúng size, hơi ôm\n• Phù hợp: Chạy tempo, chạy bộ nâng cao", "tags": "Endorphin Speed 4 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Kinvara 15 (Saucony)", "text": "Nhẹ, đơn giản, nhanh nhẹn — giày 'true to its roots' cho runner muốn cảm giác mặt đường.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 2.8–3.6 triệu\n• Form/size: Đúng size\n• Phù hợp: Chạy đường nhựa, tập hằng ngày", "tags": "Kinvara 15 giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Triumph 22 (Saucony)", "text": "Dòng êm tối đa, dày dặn, bền — đối trọng Nimbus/Glycerin.\n• Ra mắt khoảng: 2024\n• Giá tham khảo: ≈ 4.2–5.2 triệu\n• Form/size: Đúng size, rộng vừa\n• Phù hợp: Chạy chậm/đi bộ lâu, khớp cần êm", "tags": "Triumph 22 giá form phù hợp"}, {"cat": "Hãng", "title": "Mizuno – nguồn gốc & định vị", "text": "Mizuno là thương hiệu của Nhật Bản (Osaka), thành lập năm 1906. Người sáng lập: Anh em Rihachi & Rizo Mizuno.\nĐịnh vị: Nhà giày chạy Nhật với công nghệ Wave độc đáo; form châu Á hợp chân bè; dòng Wave Rider là 'bền không tưởng'..\nKhẩu hiệu: Reach Beyond..\nKhách mục tiêu: Runner phổ thông, người lớn tuổi tin đồ Nhật, khách chân bè..", "tags": "Mizuno mizuno nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Mizuno – khoảng giá", "text": "Khoảng giá sản phẩm Mizuno: 2.4–3.4 triệu (Wave Rider); 3–4 triệu (Wave Sky/Horizon); 3.5–4.5 triệu (Rebellion). Giá tham khảo. (tham khảo).", "tags": "Mizuno giá bao nhiêu"}, ng size\n• Phù hợp: Chân bẹt/lật vào, chạy ổn định", "tags": "Wave Horizon 7 giá form phù hợp"}, {"cat": "Hãng", "title": "Dr. Martens – nguồn gốc & định vị", "text": "Dr. Martens là thương hiệu của Anh/Đức (khởi đầu Đức 1947, sản xuất Anh từ 1960), thành lập năm 1947. Người sáng lập: Klaus Märtens (bác sĩ) & Griggs, gia đình Anh.\nĐịnh vị: Boot văn hóa: nhạc punk, rock, thanh niên nổi loạn; đế AirWair bền huyền thoại, được yêu cả ở thời trang đường phố..\nKhẩu hiệu: Made like no other / 'Dr. Martens. Made in England' (dòng MIE).\nKhách mục tiêu: Giới trẻ cá tính, khách cần boot đi mưa, khách văn phòng creative, khách nữ thích Jadon..", "tags": "Dr. Martens drmartens nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Dr. Martens – khoảng giá", "text": "Khoảng giá sản phẩm Dr. Martens: 3.5–5 triệu (1460/1461); 4.5–6 triệu (Jadon platform, Pascal); MIE cao hơn. Giá tham khảo. (tham khảo).", "tags": "Dr. Martens giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Dr. Martens – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• 1460 (8 lỗ): Boot cổ điển da Smooth với chỉ vàng và đế AirWair; 'đôi boot của mọi mùa' ở xứ mưa.\n• 1461 (3 lỗ): Phiên bản thấp cổ của 1460 — nhẹ nhàng hơn, hợp văn phòng casual.\n• Jadon (đế 5cm): Bản đế cao platform, hot trong giới trẻ; tôn chiều cao rõ.", "tags": "Dr. Martens dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Dr. Martens – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Bền nhất trong các loại giày da thời trang (5–10 năm)\n• Chống mưa tốt\n• Đế AirWair huyền thoại, dấu hiệu nhận diện rõ\nĐiểm cần biết:\n• Đau gót/mắt cá khi mới mua (1–2 tuần)\n• Nặng (mỗi đôi ~1kg)\n• Đế có thể nứt nếu cất lâu nơi nóng/lạnh", "tags": "Dr. Martens có tốt không nên mua"}, {"cat": "Size", "title": "Dr. Martens – form & chọn size", "text": "Đúng size nhưng DA SMOOTH CỨNG: chân bè/đi tất dày nên +0.5. Cần 'break-in' 1–2 tuần (dùng gót dán + tất dày). Dòng Nappa/Pascal mềm hơn, ít đau hơn.", "tags": "Dr. Martens size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Dr. Martens – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Chỉ vàng (yellow welt stitching) đều, 2 hàng mũi chuẩn; đế có logo 'AirWair with Bouncing Soles' in ở gót/lòng đế\n• Lưỡi giày có tem 'Dr. Martens' + size; hộp vàng-xanh đặc trưng có nhãn mã\n• Da Smooth bóng đều, các mũi khâu ở mũi giày đều đặn; hàng nhái thường sai tỷ lệ mũi khâu và logo lệch\n• Lỗ luồn dây kim loại chắc, đanh; tag bên trong có in 'Made in...' đúng dòng (bản MIE có mác riêng)", "tags": "Dr. Martens check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "1460 (8 lỗ) (Dr. Martens)", "text": "Boot cổ điển da Smooth với chỉ vàng và đế AirWair; 'đôi boot của mọi mùa' ở xứ mưa.\n• Ra mắt khoảng: 1960\n• Giá tham khảo: ≈ 3.7–4.9 triệu\n• Form/size: Đúng size; da cứng, chân bè +0.5; đi tất dày +0.5\n• Phù hợp: Đi mưa, đi làm, gu rock/street", "tags": "1460 (8 lỗ) giá form phù hợp"}, {"cat": "Mẫu giày", "title": "1461 (3 lỗ) (Dr. Martens)", "text": "Phiên bản thấp cổ của 1460 — nhẹ nhàng hơn, hợp văn phòng casual.\n• Ra mắt khoảng: 1960\n• Giá tham khảo: ≈ 3.5–4.5 triệu\n• Form/size: Đúng size, +0.5 nếu chân bè\n• Phù hợp: Đi làm, đi học, phối quần âu", "tags": "1461 (3 lỗ) giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Jadon (đế 5cm) (Dr. Martens)", "text": "Bản đế cao platform, hot trong giới trẻ; tôn chiều cao rõ.\n• Ra mắt khoảng: 2015\n• Giá tham khảo: ≈ 4.6–6 triệu\n• Form/size: Hơi nặng nên cần ôm chắc: đúng size\n• Phù hợp: Gu nổi bật, phối váy/ống rộng", "tags": "Jadon (đế 5cm) giá form phù hợp"}, {"cat": "Hãng", "title": "Timberland – nguồn gốc & định vị", "text": "Timberland là thương hiệu của Mỹ, thành lập năm 1952 (thương hiệu Timberland; đôi boot huyền thoại 6-inch ra đời 1973). Người sáng lập: Nathan Swartz (abington Shoe Company → The Timberland Company, 1978).\nĐịnh vị: Boot 'yellow boot' huyền thoại, gắn hip-hop/văn hóa đường phố; chuẩn mực cho boot chống nước, đi địa hình..\nKhẩu hiệu: Built for the Bold..\nKhách mục ", "tags": "Premium 6-Inch Waterproof giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Field Boot / Chukka (Timberland)", "text": "Bản cổ thấp/cổ trung nhẹ hơn, dễ phối hơn cho đi làm.\n• Ra mắt khoảng: 1983 (Chukka)\n• Giá tham khảo: ≈ 2.6–3.6 triệu\n• Form/size: Đúng size\n• Phù hợp: Đi làm, đi chơi đông", "tags": "Field Boot / Chukka giá form phù hợp"}, {"cat": "Hãng", "title": "Merrell – nguồn gốc & định vị", "text": "Merrell là thương hiệu của Mỹ, thành lập năm 1981. Người sáng lập: Clark Matis, John Schweizer, Randy Merrell (Vermont).\nĐịnh vị: Giày hiking/đi bộ đường dài bình dân; Moab là đôi hiking bán chạy nhất thế giới (hơn 30 triệu đôi)..\nKhẩu hiệu: Let's Get Outside..\nKhách mục tiêu: Dân du lịch/trekking, gia đình đi rừng, khách mua giày chống trơn..", "tags": "Merrell merrell nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Merrell – khoảng giá", "text": "Khoảng giá sản phẩm Merrell: 2.5–3.5 triệu (Moab 3); 3–4 triệu (Moab Speed, Agility Peak). Giá tham khảo. (tham khảo).", "tags": "Merrell giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Merrell – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Moab 3: Hiking 'quốc dân' thế giới: bám tốt, êm vừa, bền; đa số khách leo núi lần đầu chọn đôi này.\n• Moab Speed 2: Bản nhẹ và nhanh hơn của Moab, phù hợp fast-hiking.", "tags": "Merrell dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Merrell – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Bám tốt, an toàn trên mặt đá/bùn\n• Bền, thay thế dễ (bán phổ biến)\n• Giá tốt phân khúc hiking\nĐiểm cần biết:\n• Thẩm mỹ 'đi rừng' không dùng phố được\n• Bản không GORE-TEX chỉ chống nước nhẹ", "tags": "Merrell có tốt không nên mua"}, {"cat": "Size", "title": "Merrell – form & chọn size", "text": "Đúng size, hơi rộng — chân bè thường vẫn vừa. Chọn +0.5 nếu đi tất dày leo núi.", "tags": "Merrell size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Merrell – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo Merrell ở hông và đế né a.", "tags": "Crocs dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Crocs – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Nhẹ + rửa nước + thoáng — cực hợp khí hậu miền Nam\n• Giá tốt, bền (dùng 2–4 năm)\n• Trend collab + Jibbitz tạo cá tính\nĐiểm cần biết:\n• Trơn trên sàn ướt bóng\n• Dễ ra mồ hôi khi đi lâu trời nóng\n• Nhìn 'không trang trọng'", "tags": "Crocs có tốt không nên mua"}, {"cat": "Size", "title": "Crocs – form & chọn size", "text": "KHÔNG dùng size US đơn thuần: hãy chọn theo CM chân, còn dư nhẹ sau gót. Người chân bè dùng bản 'Regular' (không phải Narrow). Không nên dư quá 1cm vì dễ tuột.", "tags": "Crocs size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Crocs – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Logo 'crocs' in nét ở quai đầu + chữ 'CROCS' khắc ở đế\n• Kích cỡ in cả cm và US (j1, j2... cho trẻ em) — tra đúng bảng cm\n• Nhựa đều màu, không mùi nhựa nồng; hàng nhái thường cứng hơn và mùi hơn", "tags": "Crocs check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Classic Clog (Crocs)", "text": "Dép nhựa huyền thoại: nhẹ, rửa nước được, đi mưa cực tốt; thêm Jibbitz cá nhân hóa.\n• Ra mắt khoảng: 2002\n• Giá tham khảo: ≈ 950k–1.4 triệu\n• Form/size: Chọn theo cm, dư nhẹ 0.5cm; chân bè dùng Regular\n• Phù hợp: Đi mưa, đi biển, đi chợ, đi spa, mang trong nhà", "tags": "Classic Clog giá form phù hợp"}, {"cat": "Mẫu giày", "title": "All-Terrain Clog (Crocs)", "text": "Bản Clog có quai gót chắc hơn, đế sâu bám hơn — đi dạo đường dài được.\n• Ra mắt khoảng: 2021\n• Giá tham khảo: ≈ 1.4–1.9 triệu\n• Form/size: Theo cm\n• Phù hợp: Đi chơi, du lịch, đi mưa", "tags": "All-Terrain Clog giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Classic Sandal / Literide (Crocs)", "text": "Sandal êm và giày Literide (đệm mềm hơn) cho người cần thoáng tối đa.\n• Ra mắt khoảng: 2019–nay\n• Giá tham khảo: ≈ 900k–1.8 triệu\n• Form/size: Theo cm\n• Phù hợp: Người lớn tuổi, đi bộ nhẹ mùa nóng", "tags": "Classic Sandal / "Juno juno nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Juno – khoảng giá", "text": "Khoảng giá sản phẩm Juno: ≈ 300k–900k (đa số 350–650k). Giá tham khảo. (tham khảo).", "tags": "Juno giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Juno – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Búp bê Juno / Loafer Juno: Giày nữ công sở/học sinh: búp bê gót nhỏ, loafer bệt — bán chạy ở kênh online.\n• Sneaker nữ Juno: Sneaker trắng/đen nữ, đế nhẹ, form gọn chân.", "tags": "Juno dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Juno – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Giá mềm, mẫu cập nhật nhanh theo trend\n• Kênh online tiện (Shopee/Lazada/web)\n• Made in Vietnam\nĐiểm cần biết:\n• Chất liệu da PU kém bền hơn da thật\n• Form size giữa các mẫu chưa đồng nhất → cần tư vấn kỹ size", "tags": "Juno có tốt không nên mua"}, {"cat": "Size", "title": "Juno – form & chọn size", "text": "Một số dòng hơi chật mũi: chân dài/bè nên +0.5 size.", "tags": "Juno size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Juno – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Mua tại shop chính hãng (Juno Official) để được bảo hành đường may/keo\n• Kiểm tra đường chỉ mũi giày, mí đế; da PU không mùi nhựa nồng", "tags": "Juno check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Búp bê Juno / Loafer Juno (Juno)", "text": "Giày nữ công sở/học sinh: búp bê gót nhỏ, loafer bệt — bán chạy ở kênh online.\n• Ra mắt khoảng: 2016\n• Giá tham khảo: ≈ 300–500k\n• Form/size: Nên chọn +0.5 size vì form hơi chật mũi\n• Phù hợp: Đi học, đi làm văn phòng, mặc đồ nữ tính", "tags": "Búp bê Juno / Loafer Juno giá form phù hợp"}, {"cat": "Mẫu giày", "title": "Sneaker nữ Juno (Juno)", "text": "Sneaker trắng/đen nữ, đế nhẹ, form gọn chân.\n• Ra mắt khoảng: 2020\n• Giá tham khảo: ≈ 450–800k\n• Form/size: Đúng size\n• Phù hợp: Đi học, đi chơi hằng ngày", "tags": "Sneaker nữ Juno giá form phù hợp"}, {"cat": "Hãng", "title": "Vascara – nguồn gốc & định vị", "text": "Vascara là thương hiệu của Việt Nam, thành lập năm 2007. Người sáng lập: Thương hiệu thời trang nữ & phụ kiện (giày, túi) Việt Nam.\nĐịnh vị: Chuỗi bán giày-túi nữ lớn của Việt Nam (>130 cửa hàng); phân khúc văn phòng/phổ thông, hướng tới phái đẹp công sở..\nKhẩu hiệu: N/A.\nKhách mục tiêu: Khách nữ dân văn phòng, khách 30+ thích mẫu bền, mua kèm túi..", "tags": "Vascara vascara nguồn gốc nước nào thành lập"}, {"cat": "Giá", "title": "Vascara – khoảng giá", "text": "Khoảng giá sản phẩm Vascara: ≈ 400k–1.5 triệu. Giá tham khảo. (tham khảo).", "tags": "Vascara giá bao nhiêu"}, {"cat": "Sản phẩm", "title": "Vascara – các dòng nổi bật", "text": "Các dòng tiêu biểu:\n• Giày cao gót/giày bệt công sở Vascara: Các mẫu giày công sở nữ: pump, slingback, bệt, sandal; phục vụ khách lớn tuổi hơn & nhân viên văn phòng.", "tags": "Vascara dòng nào mẫu nào bán chạy"}, {"cat": "Tư vấn", "title": "Vascara – thế mạnh & điểm yếu", "text": "Thế mạnh:\n• Hệ thống cửa hàng lớn, đổi trả thuận tiện\n• Mẫu mã công sở phong phú, phối được với túi\n• Bảo hành sửa chữa tại cửa hàng\nĐiểm cần biết:\n• Giá cao hơn hàng online cùng mẫu\n• Một số mẫu bị chê cứng đế lúc mới", "tags": "Vascara có tốt không nên mua"}, {"cat": "Size", "title": "Vascara – form & chọn size", "text": "Nên thử; một số mẫu cao gót có xu hướng chật mũi.", "tags": "Vascara size form ôm rộng chân bè đúng size"}, {"cat": "Check chính hãng", "title": "Vascara – phân biệt thật/giả", "text": "Cách kiểm tra:\n• Hộp + logo Vascara; hóa đơn cửa hàng; giày có mã/tag sản phẩm\n• Kiểm tra mí đế dán chắc, không lộ keo quanh viền", "tags": "Vascara check real fake chính hãng phân biệt"}, {"cat": "Mẫu giày", "title": "Giày cao gót/giày bệt công sở Vascara (Vascara)", "text": "Các mẫu giày công sở nữ: pump, slingback, bệt, sandal; phục vụ khách lớn tuổi hơn & nhân viên văn phòng.\n• Ra mắt khoảng: 2007\n• Giá tham khảo: ≈ 500k–1.2 triệu\n• Form/size: Form chuẩn; guốc/sandal nên +0.5 nếu chân bè\n• Phù hợp: Đi làm, đi tiệc nhẹ, mặc đầm", "tags": "Giày cao gót/giày bệt công sở Vascara giá form phù hợp"}, {"cat": "Công nghệ", "title": "Nike Air Max / Air (túi khí) (Nike)", "text": "Túi khí nén (Air) đặt ở gót hoặc toàn bộ đế giữa, ra mắt từ 1979 (Air Tailwind). Bản 'Max' hở túi khí to dần theo thời gian, nổi tiếng nhất ở Air Max 1, 90, 95, 97, 270, VaporMax.\n• Ưu điểm: Giảm chấn tốt, êm rõ rệt ở gót, giữ phom lâu, không bị 'xẹp lún' như foam; nhận diện thương hiệu cực mạnh.\n• Nhược điểm: Túi khí có thể bị chọc thủng bởi vật nhọn; túi khí hở dễ bám bẩn khó vệ sinh; trọng lượng thường cao hơn foam.\n• Phù hợp: Đi hằng ngày, đứng/đi lâu, gu thích retro 'đế khí' — chân bè nên ưu tiên Air Max 1 thay vì Air Max 97/90 (hẹp hơn).\n• So sánh: Êm kiểu 'đàn hồi bật lại' khác với Boost (mềm úp) và React (êm cân bằng). Bền hơn foam nhưng kém linh hoạt hơn ZoomX.", "tags": "Nike Air Max / Air (túi khí) công nghệ đế đệm Đệm khí"}, {"cat": "Công nghệ", "title": "Nike Zoom Air (Nike)", "text": "Túi khí dẹt áp suất cao, bên trong có sợi đàn hồi (tensioned fibers) → phản hồi nhanh 'bật' tức thì. Dùng nhiều ở giày bóng rổ (LeBron, KD) và chạy (Pegasus 41, Vomero).\n• Ưu điểm: Phản hồi nhanh, cảm giác 'bật' tốt khi chạy/nhảy; mỏng nên giày không bị cao gót quá.\n• Nhược điểm: Ít êm nếu bạn quen max-cushion; cảm nhận khá cứng với người nhẹ cân.\n• Phù hợp: Chạy bộ cần tốc độ, bóng rổ, tập luyện cần phản hồi nhanh.\n• So sánh: Nhanh/nhẹ hơn Air Max nhưng êm hơn kém; so với Lightstrike Pro của Adidas thì Lightstrike Pro đàn hồi mạnh hơn ở tần suất sải chân cao.", "tags": "Nike Zoom Air công nghệ đế đệm Đệm khí"}, {"cat": "Công nghệ", "title": "Nike React (Nike)", "text": "Foam đàn hồi gốc từ 2017 (React Element), dùng ở Epic React, Phantom, Infinity, AF1 React. Mềm, bật, giá phải chăng hơn ZoomX.\n• Ưu điểm: Êm và đàn hồi ổn, giữ độ nảy tốt sau nhiều lần đi; giá trung bình dễ tiếp cận.\n• Nhược điểm: Nặng hơn ZoomX; ở nhiệt độ cao/deo một thời gian có xu hướng cứng dần (như đa số foam EVA).\n• Phù hợp: Chạy/đi bộ hằng ngày, ngân sách trung bình, cần đôi giày 'chắc chân'.\n• So sánh: So với Boost: React cứng hơn chút, bền form hơn; so với Fresh Foam X của NB: khá tương đương về độ êm.", "tags": "Nike React công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Nike ZoomX (Nike)", "text": "Foam PEBA siêu nhẹ, đàn hồi ~85% (cao nhất trong các foam phổ thông), dùng ở Vaporfly, Alphafly, Invincible.\n• Ưu điểm: Nhẹ + đàn hồi tốt nhất phân khúc chạy; giúp tiết kiệm năng lượng (được ưu chuộng trong giải marathon).\n• Nhược điểm: Giá rất cao (thường 5–8 triệu); độ bền foam kém hơn EVA — đi tập luyện hàng ngày sẽ nhanh 'xẹp'.\n• Phù hợp: Chạy race/marathon, chạy tempo cần tốc độ; không khuyến khích làm giày đi lại hằng ngày.\n• So sánh: Đàn hồi hơn Lightstrike Pro ở tốc độ thấp nhưng bền kém hơn; so với PWRRUN PB của Saucony thì tương đồng chất liệu PEBA, PWRRUN PB hơi 'êm' hơn.", "tags": "Nike ZoomX công nghệ đế đệm Foam đệm hiệu năng cao"}, {"cat": "Công nghệ", "title": "Nike Flyknit / AtomKnit (Nike)", "text": "Vải dệt một mảnh ôm chân như tất, ra mắt 2012. AtomKnit (Vaporfly) là bản dệt mỏng nhẹ - thoáng hơn.\n• Ưu điểm: Ôm chân, thoáng, nhẹ, thích nghi form bàn chân rất tốt, hạn chế đường may cọ xát.\n• Nhược điểm: Chân bè/chân dày ngang sẽ thấy bó; đàn hồi của vải dệt giảm dần sau 1–2 năm; khó vệ sinh nếu thấm nước.\n• Phù hợp: Chân thon, thích cảm giác ôm như tất, đi mùa nóng.\n• So sánh: Tương tự Primeknit của Adidas; Flyknit thường mảnh và chắc hơn, AtomKnit thoáng nhất trong nhóm.", "tags": "Nike Flyknit / AtomKnit công nghệ đế đệm Thân giày (upper)"}, {"cat": "Công nghệ", "title": "Nike Flyplate (carbon) (Nike)", "text": "Tấm sợi carbon dài đặt trong đế giữa (Vaporfly/Alphafly), phối cùng ZoomX tạo hiệu ứng 'nảy tới trước'.\n• Ưu điểm: Tăng tốc rõ rệt, giảm mỏi bàn chân khi chạy đường dài; cảm giác 'đẩy đi' đặc trưng.\n• Nhược điểm: Giá cao; thời gian đầu có thể mỏi bắp chân do thay đổi dáng chạy; không dành cho người mới chạy hoặc đi bộ tiệm.\n• Phù hợp: Runner có kinh nghiệm, chạy race 5km–marathon.\n• So sánh: Đối trọng: Adizero Adios Pro (EnergyRods + Lightstrike Pro), Saucony Endorphin Pro (PWRRUN PB + plate), Hoka Rocket X.", "tags": "Nike Flyplate (carbon) công nghệ đế đệm Tấm đàn hồi (plate)"}, {"cat": "Công nghệ", "title": "Adidas Boost (Adidas)", "text": "Foam hạt TPU nén (pellets) ra mắt 2013 trên Energy Boost; hạt nở bung tạo cảm giác 'dẫm lên kẹo dẻo'. Dùng ở Ultraboost, NMD, Pureboost, Yeezy.\n• Ưu điểm: Rất êm và đàn hồi, giữ tính năng qua nhiều năm; đếm trọng lượng cao nhưng cảm giác 'che chân' rất tốt.\n• Nhược điểm: Nặng hơn foam mới; foam trắng/trong dễ ngả vàng nếu phơi nắng lâu; cảm giác hơi 'thụ động' với người thích giày cứng.\n• Phù hợp: Đi bộ/đứng nhiều, đi làm, người thích đệm êm nhất trong khoảng giá 3–5 triệu. Chân bè nên lên 0.5 size vì thân Primeknit ôm.\n• So sánh: Êm úp và bám chân hơn React; bền hơn ZoomX nhưng kém nhanh hơn Lightstrike Pro ở giày race. Khác biệt dễ thấy nhất khi thử Ultraboost vs AF1 React.", "tags": "Adidas Boost công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Adidas Lightstrike / Lightstrike Pro (Adidas)", "text": "Foam EVA siêu nhẹ (Lightstrike, 2019) và bản PEBA siêu đàn hồi (Lightstrike Pro) dùng ở Adizero Adios Pro — giày race kỷ lục thế giới của Adidas.\n• Ưu điểm: Nhẹ, phản hồi nhanh; Lightstrike Pro cực kỳ đàn hồi ở tốc độ cao, cảm giác 'nảy' mạnh.\n• Nhược điểm: Bản thường độ bền foam trung bình; giá Lightstrike Pro cao (giày race 5–8 triệu).\n• Phù hợp: Chạy tốc độ, tập tempo, race. Bản Lightstrike thường phù hợp đi tập gym hàng ngày.\n• So sánh: So với ZoomX: Lightstrike Pro bền hơn, đàn hồi tương đương về cảm nhận; so với Boost: nhẹ hơn nhiều nhưng kém êm khi đi bộ chậm.", "tags": "Adidas Lightstrike / Lightstrike Pro công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Adidas Primeknit (Adidas)", "text": "Thân dệt 3D ôm chân (ra mắt 2012) dùng ở Ultraboost, NMD, ZX, Samba có bản Primeknit.\n• Ưu điểm: Ôm như tất, thoáng, co giãn; phối màu dệt rất đẹp.\n• Nhược điểm: Chân bè nên lên 0.5 size; vải dệt bám bụi, khó làm sạch hơn da; form giãn theo thời gian.\n• Phù hợp: Chân thon, thích giày ôm; hợp đi hằng ngày mùa hè.\n• So sánh: Tương tự Flyknit (Nike) và Engineered Mesh; Primeknit co giãn rộng hơn Flyknit.", "tags": "Adidas Primeknit công nghệ đế đệm Thân giày (upper)"}, {"cat": "Công nghệ", "title": "Adidas Torsion System (Adidas)", "text": "Tấm chịu xoắn đặt giữa giữa đế trước và gót, cho phần trước và gót chuyển động độc lập (từ 1988, nay dùng Torsion X ở Samba/Ozweego).\n• Ưu điểm: Ổn định bàn chân, hỗ trợ chuyển động tự nhiên, tăng độ bền kết cấu.\n• Nhược điểm: Với người chân bẹt nặng có thể thấy 'cấn' trong tuần đầu.\n• Phù hợp: Giày thể thao/đi hằng ngày cần ổn định; đặc biệt hữu ích với giày đế chunky.\n• So sánh: Tương tự Trusstic (Asics), ROLLBAR (New Balance), GuideRails (Brooks) – đều là hệ thống ổn định cấu trúc.", "tags": "Adidas Torsion System công nghệ đế đệm Hệ thống ổn định"}, {"cat": "Công nghệ", "title": "Adidas Continental™ Rubber (đế ngoài) (Adidas)", "text": "Cao su đế ngoài do Continental (hãng lốp xe) sản xuất, dùng ở Ultraboost, Terrex, một số mẫu chạy.\n• Ưu điểm: Độ bám ẩm ướt rất tốt, chống mài mòn cao — thực tế bền hơn đế cao su thường.\n• Nhược điểm: Đế cứng hơn cao su mềm thông dụng, cảm giác 'rít' hơi nhiều với người thích đế mềm.\n• Phù hợp: Đi mưa, đường trơn, đi bộ đường dài, giày cần độ bền đế.\n• So sánh: Tương đương chất lượng với AHAR+ (Asics), X10 (Mizuno), Contagrip (Salomon), Vibram ở các hãng khác.", "tags": "Adidas Continental™ Rubber (đế ngoài) công nghệ đế đệm Đế ngoài"}, {"cat": "Công nghệ", "title": "Adidas 4D (Adidas)", "text": "Đế giữa in 3D (Digital Light Synthesis) từ năm 2017, cấu trúc lưới hở; dùng ở 4DFWD, ZX 4D.\n• Ưu điểm: Cấu trúc lưới mở cho phản hồi khác biệt, bền, nhìn 'công nghệ'; một số bản sử dụng vật liệu tái chế.\n• Nhược điểm: Giá cao (thường 5–8 triệu), cảm giác khá 'cứng' nếu bạn quen đệm mút; ào bụi ở các kẽ lưới (phải vệ sinh kỹ).\n• Phù hợp: Gu thích công nghệ/độc đáo, đi dạo hơn là chạy; ngân sách cao.\n• So sánh: Khác biệt hoàn toàn với foam: 4D cứng hơn, bền hơn, phản hồi 'cơ học' chứ không mềm kiểu Boost.", "tags": "Adidas 4D công nghệ đế đệm Đệm in 3D"}, {"cat": "Công nghệ", "title": "Asics GEL (Asics)", "text": "Gel giảm chấn đặt ở gót (và một số mẫu ở mũi) từ 1986; là 'linh hồn' của Gel-Nimbus, Gel-Kayano, Gel-Cumulus.\n• Ưu điểm: Giảm chấn gót rất tốt, ổn định, bền; phù hợp người cân nặng trung bình – lớn cần bảo vệ khớp.\n• Nhược điểm: Trọng lượng cao hơn foam thuần; gel có thể cảm thấy 'lạnh/cứng' khi mới đi vào trời rét (không đáng kể ở VN).\n• Phù hợp: Chạy bộ đường dài, người bị đau khớp nhẹ, chân bẹt nhẹ (kèm hệ thống ổn định của Kayano).\n• So sánh: Cảm giác 'êm nhưng chắc' khác Boost (mềm úp); so với Zoom Air: GEL êm hơn ở gót nhưng kém 'bật' hơn.", "tags": "Asics GEL công nghệ đế đệm Đệm gel"}, {"cat": "Công nghệ", "title": "Asics FF BLAST / FF BLAST PLUS / TURBO (Asics)", "text": "Dòng foam thế hệ mới (2020–nay): FF BLAST (Cumulus), FF BLAST PLUS (Nimbus 26, Novablast, Kayano 31), FF BLAST TURBO (Metaspeed).\n• Ưu điểm: Nhẹ, êm, đàn hồi; FF BLAST PLUS kết hợp êm + bền — được đánh giá là foam 'daily training' rất cân bằng.\n• Nhược điểm: Bản TURBO trên Metaspeed cần tốc độ mới thấy rõ giá trị.\n• Phù hợp: Chạy hàng ngày (Novablast, Cumulus), chạy êm (Nimbus), chạy race (Metaspeed) — thuộc nhóm foam đáng tiền nhất hiện nay.\n• So sánh: So với Fresh Foam X (NB): tương đương; so với PWRRUN+ (Saucony): FF BLAST PLUS bền hơn khi chạy quãng dài.", "tags": "Asics FF BLAST / FF BLAST PLUS / TURBO công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Asics FlyteFoam (Asics)", "text": "Foam từ sợi nano cellulose (2015), các bản FlyteFoam Blast/Propulsion dùng ở Kayano/GT-2000 các đời trước.\n• Ưu điểm: Siêu nhẹ, độ bền cao, ổn định — tiêu chuẩn cũ của giày chạy Asics.\n• Nhược điểm: Êm kém hơn FF BLAST đời mới; nhiều mẫu đã thay bằng FF BLAST.\n• Phù hợp: Những ai cần giày chạy bền bỉ, ổn định, trọng lượng nhẹ.\n• So sánh: Thế hệ trước của FF BLAST; đừng nhầm 'FlyteFoam' với 'FF BLAST' khi tư vấn khách so sánh đời giày.", "tags": "Asics FlyteFoam công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Asics AHAR / AHAR+ (đế ngoài) (Asics)", "text": "'Asics High Abrasion Rubber' – cao su chống mài mòn cao, đặt ở vùng gót/mũi; AHAR+ nhẹ hơn AHAR ~50% nhưng bền tương đương.\n• Ưu điểm: Cực bền — nhiều runner đi 800–1.000km vẫn chưa mòn hết đế; bám tốt.\n• Nhược điểm: Không phải điểm để 'khoe' — khách thường không biết, cần tư vấn mới thấy giá trị.\n• Phù hợp: Chạy bộ quãng đường lớn, đi bộ đường dài, tiết kiệm chi phí thay giày.\n• So sánh: Tương đương Continental (Adidas), X10 (Mizuno), NDurance (New Balance).", "tags": "Asics AHAR / AHAR+ (đế ngoài) công nghệ đế đệm Đế ngoài"}, {"cat": "Công nghệ", "title": "Asics Trusstic System / DuoMax / 4D Guidance (Asics)", "text": "Trusstic: tấm nhựa dưới vòm chống xoắn; DuoMax: lớp foam đậm hơn ở cạnh trong chống lật vào; Kayano 31/32 dùng '4D Guidance System' thay thế DuoMax.\n• Ưu điểm: Hỗ trợ chân bẹt/lật vào rất hiệu quả, giảm đau gối; Kayano là 'vua giày ổn định' nhiều năm.\n• Nhược điểm: Người chân bình thường có thể thấy 'cấn' ở vòm nếu đi size sai.\n• Phù hợp: Chân bẹt, chân lật vào (overpronation), người đau gối khi chạy.\n• So sánh: Cùng nhóm với GuideRails (Brooks), ROLLBAR (NB 860), J-Frame (Hoka Arahi).", "tags": "Asics Trusstic System / DuoMax / 4D Guidance công nghệ đế đệm Hệ thống ổn định"}, {"cat": "Công nghệ", "title": "Mizuno Wave (Mizuno)", "text": "Tấm đế dạng 'sóng' (nhựa hoặc foam) giữa hai lớp đế giữa, phân tán lực ra hai bên thay vì nén trực tiếp — công nghệ từ 1997.\n• Ưu điểm: Vừa đệm vừa ổn định trong một cấu trúc, cảm giác chắc chắn nhưng không bị 'chết đế'; rất bền.\n• Nhược điểm: Êm hơn kém foam mềm kiểu Boost; thương hiệu ít được biết ở phân khúc lifestyle.\n• Phù hợp: Chạy bộ cần ổn định kèm đệm, chân bè (Mizuno form châu Á rộng mũi).\n• So sánh: Wave Rider là đối thủ trực tiếp của Asics Cumulus; cả hai đều hợp bàn chân châu Á.", "tags": "Mizuno Wave công nghệ đế đệm Hệ thống đệm + ổn định"}, {"cat": "Công nghệ", "title": "New Balance Fresh Foam X (New Balance)", "text": "Foam đúc theo dữ liệu áp lực bàn chân; Fresh Foam X là bản cao cấp dùng ở 1080v14, 880v14, More v5, Hierro.\n• Ưu điểm: Êm mượt, 'êm ngay từ bước đầu'; phân bố áp lực đều, phù hợp người đi bộ nhiều.\n• Nhược điểm: Ở bản thường (không phải X) độ đàn hồi chỉ ở mức khá; foam mềm nên người nặng cân có thể thấy lún nhanh hơn.\n• Phù hợp: Chạy/đi bộ êm ái, người trên 70kg nên chọn bản X hoặc More v5 (đệm dày hơn).\n• So sánh: Gần với FF BLAST PLUS; êm hơn React và Boost một chút theo đánh giá người dùng.", "tags": "New Balance Fresh Foam X công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "New Balance FuelCell (New Balance)", "text": "Foam nitrogen-infused nhẹ và đàn hồi, dùng ở RC Elite, SuperComp Trainer, Rebel — nhóm giày chạy tốc độ của NB.\n• Ưu điểm: Nhẹ, bật tốt, giá thường thấp hơn ZoomX/Lightstrike Pro cùng phân khúc race.\n• Nhược điểm: Độ bền foam trung bình, không nên dùng làm giày đi lại hàng ngày.\n• Phù hợp: Chạy tempo/race với ngân sách vừa.\n• So sánh: Ngang phân khúc ZoomX nhưng giá dễ chịu hơn; SuperComp Trainer (SC Trainer) là lựa chọn rất đáng tiền cho tập dài.", "tags": "New Balance FuelCell công nghệ đế đệm Foam đệm tốc độ"}, {"cat": "Công nghệ", "title": "New Balance ABZORB (New Balance)", "text": "Hệ đệm hấp thụ chấn động lâu đời (ABZORB, ABZORB SBS) — 'linh hồn' của các đôi 530, 9060, 2002R, 1906R retro.\n• Ưu điểm: Êm kiểu cổ điển dễ chịu, giữ phom tốt; là lý do các đôi retro NB đi bộ rất thoải mái.\n• Nhược điểm: Không được 'nảy' như foam mới; trọng lượng trung bình.\n• Phù hợp: Đi bộ hàng ngày, người thích giày retro êm chân.\n• So sánh: Tương đương Air (Nike) ở mục đích 'êm hằng ngày' nhưng ABZORB mềm hơn, êm kiểu mút.", "tags": "New Balance ABZORB công nghệ đế đệm Đệm"}, {"cat": "Công nghệ", "title": "New Balance ENCAP / ROLLBAR (New Balance)", "text": "ENCAP = foam bọc rim polyurethane (bền + ổn định) ở 574, 990; ROLLBAR = thanh chống lật vào ở các mẫu 860/990 stability.\n• Ưu điểm: Bền cấu trúc, chống nghiêng bàn chân, hỗ trợ người chân bẹt.\n• Nhược điểm: Cứng hơn các đệm mới; không cần thiết với chân bình thường đi nhẹ nhàng.\n• Phù hợp: Chân bẹt/chân hơi lật vào, cần giày chắc chân đi hằng ngày.\n• So sánh: Tương tự DuoMax/4D Guidance của Asics và GuideRails của Brooks.", "tags": "New Balance ENCAP / ROLLBAR công nghệ đế đệm Ổn định"}, {"cat": "Công nghệ", "title": "New Balance size bề ngang (D / 2E / 4E) (New Balance)", "text": "NB bán nhiều mẫu với các bề ngang chuẩn: D (trung bình), 2E (rộng), 4E (rất rộng), có cả B (hẹp) cho nữ.\n• Ưu điểm: Lựa chọn tốt nhất cho chân bè/chân dày ở phân khúc phổ thông — nhiều hãng khác không làm.\n• Nhược điểm: Size rộng có thể hết hàng nhanh; mẫu lifestyle retro không phải đôi nào cũng có 2E/4E.\n• Phù hợp: Chân bè, chân dày, người bị chai chân ở má ngoài, người lớn tuổi cần chỗ thoải mái.\n• So sánh: Nike/Adidas chỉ có một bề ngang chuẩn cho hầu hết mẫu → chân bè nên cân nhắc NB trước tiên.", "tags": "New Balance size bề ngang (D / 2E / 4E) công nghệ đế đệm Size đặc biệt"}, {"cat": "Công nghệ", "title": "Brooks DNA LOFT / DNA Glycerin (Brooks)", "text": "Foam kết hợp EVA + cao su + 'không khí huyền phù' — DNA LOFT v3 ở Glycerin 21/22, Ghost Max; DNA Glycerin ở bản 2025 (Glycerin 22).\n• Ưu điểm: Êm mềm đáng kể mà không bị 'sụp hố'; bền; phù hợp người cần đệm tối đa để đi bộ.\n• Nhược điểm: Ít 'bật' — không hợp người thích giày nhanh nhẹn; trọng lượng khá.\n• Phù hợp: Chạy chậm–trung bình, đi bộ đường dài, vòm cao (vòm cao cần đệm nhiều).\n• So sánh: Êm ngang Nimbus của Asics; Glycerin (Brooks) được nhiều người chọn làm 'đôi đi làm' êm chân.", "tags": "Brooks DNA LOFT / DNA Glycerin công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Brooks GuideRails (Brooks)", "text": "Hai thanh nâng ở cạnh gót (2021 trên Adrenaline GTS) giữ đầu gối và bàn chân đi thẳng thay vì phong toả cứng bàn chân.\n• Ưu điểm: Hỗ trợ lật vào tự nhiên hơn kê gót cứng; giảm đau khớp gối rõ với nhiều khách hàng.\n• Nhược điểm: Không thay thế được giày ổn định y tế cho chân bẹt nặng.\n• Phù hợp: Chân bẹt nhẹ–vừa, chân lật vào, người đau khớp gối khi chạy.\n• So sánh: Mềm/mượt hơn DuoMax (Asics Kayano) và J-Frame (Hoka Arahi); là 'vua ổn định êm' ở phân khúc phổ thông.", "tags": "Brooks GuideRails công nghệ đế đệm Hệ thống ổn định"}, {"cat": "Công nghệ", "title": "Saucony PWRRUN / PWRRUN+ / PWRRUN PB (Saucony)", "text": "Ba cấp foam: PWRRUN (bền, hằng ngày — Ride 17), PWRRUN+ (nhẹ êm hơn — Triumph 22), PWRRUN PB (PEBA siêu nhẹ cho Endorphin Pro/Speed).\n• Ưu điểm: Dải giá rộng — Endorphin Speed với PWRRUN PB + plate nylon là đôi 'chạy nhanh' đáng tiền nhất phân khúc 4–5 triệu.\n• Nhược điểm: Thương hiệu ít phổ biến tại VN, khó thử trực tiếp; bản PB kém bền foam.\n• Phù hợp: Chạy bộ đủ level: Ride/Guide (hằng ngày), Triumph (êm), Endorphin (tốc độ).\n• So sánh: Endorphin Speed ↔ Adizero SL/Boston, Zoom Fly; được giới chạy bộ VN ưu chuộng vì hiệu năng/giá.", "tags": "Saucony PWRRUN / PWRRUN+ / PWRRUN PB công nghệ đế đệm Foam đệm"}, {"cat": "Công nghệ", "title": "Hoka Meta-Rocker (Hoka)", "text": "Đế 'con thoi' cong ở mũi và gót (không phải plate) tạo roll tự nhiên từ gót → mũi, giúp nhịp chân trôi chảy.\n• Ưu điểm: Giúp chạy/đi bộ 'mượt', giảm mỏi cổ chân; đế dày nên rất êm mà không nặng như tưởng tượng.\n• Nhược điểm: Người mới đi dễ 'gập bàn chân' tăng dần → cần 1–2 tuần làm quen; đế dày gây cảm giác chông chênh ban đầu.\n• Phù hợp: Đi bộ/đứng lâu (Bondi), chạy hàng ngày (Clifton, Mach), chạy trail (Speedgoat).\n• So sánh: Clifton (êm, nhẹ) ↔ Nimbus/1080; Bondi (êm nhất) ↔ Glycerin/More v5. Đế dày nhất nhóm daily.", "tags": "Hoka Meta-Rocker công nghệ đế đệm Hình dáng đế"}, {"cat": "Công nghệ", "title": "Hoka J-Frame (Hoka)", "text": "Lớp foam cứng hình chữ J ở cạnh trong bàn chân trên Arahi — chống lật vào mà không cần khối kê gót cứng.\n• Ưu điểm: Ổn định êm, nhẹ so với giày ổn định truyền thống; rất được người chân bẹt ưa.\n• Nhược điểm: Không dành cho lật vào nghiêm trọng; cần chọn đúng size vì đế dày.\n• Phù hợp: Chân bẹt/chân lật vào nhẹ–vừa, thích đệm dày.\n• So sánh: Mềm hơn GuideRails (Brooks Adrenaline) một chút; Arahi 7 là đối thủ trực tiếp của Kayano.", "tags": "Hoka J-Frame công nghệ đế đệm Hệ thống ổn định"}, {"cat": "Công nghệ", "title": "On CloudTec (On)", "text": "'Các đám mây' rỗng dưới đế nén lại khi tiếp đất (Cloud 5, Cloudmonster), kết hợp Speedboard bên trong.\n• Ưu điểm: Cảm giác tiếp đất rất êm rồi 'bật' lại; ngoại hình đẹp, được ưa ở giới công sở/đi làm.\n• Nhược điểm: Khe Cloud dễ kẹt sỏi đá nhỏ; đế mòn nhanh hơn nếu đi nhiều trên nhựa đường; giá cao so với cấu hình.\n• Phù hợp: Đi làm, đi bộ thành phố, chạy nhẹ; ngân sách 3.5–5 triệu.\n• So sánh: Cảm giác khác hoàn toàn: không êm như Nimbus nhưng 'nhẹ bẫng' đặc trưng. Cloudmonster (On) ↔ Bondi (Hoka) về độ đế dày.", "tags": "On CloudTec công nghệ đế đệm Cấu trúc đế"}, {"cat": "Công nghệ", "title": "On LightSpray (On)", "text": "Công nghệ phun thân giày tự động (2024/2025, dùng trên Cloudboom Strike) — một mảnh dệt không đường may, siêu nhẹ.\n• Ưu điểm: Nhẹ kỷ lục, giảm lãng phí vật liệu; đang là điểm nóng công nghệ thế giới.\n• Nhược điểm: Mới, giá cao, độ bền thực tế cần thời gian kiểm chứng; chưa phổ biến ở VN.\n• Phù hợp: Runner/người mê công nghệ, ngân sách cao — hiện chủ yếu là giày race.\n• So sánh: Đối sánh Flyknit/AtomKnit (Nike), Primeknit (Adidas) nhưng nhẹ hơn do không may.", "tags": "On LightSpray công nghệ đế đệm Thân giày (upper)"}, {"cat": "Công nghệ", "title": "Salomon Contagrip / Quicklace / GORE-TEX (Salomon)", "text": "Bộ ba đặc trưng của Salomon: Contagrip (cao su bám theo từng loại địa hình), Quicklace (dây rút kéo một phát), màng GORE-TEX chống nước.\n• Ưu điểm: Bám tốt nhất phân khúc trail; GORE-TEX giữ khô chân khi mưa; Quicklace tiện khi đi nhanh.\n• Nhược điểm: GORE-TEX kém thoáng — đi trời nóng dễ bí; giá trail cao (3.5–6 triệu).\n• Phù hợp: Đi phượt, hiking, mưa nhiều; XT-6 dùng hàng ngày theo trend gorpcore.\n• So sánh: Contagrip ↔ Vibram (như Hoka Speedgoat dùng Vibram); cả hai đều là chuẩn mực đế trail.", "tags": "Salomon Contagrip / Quicklace / GORE-TEX công nghệ đế đệm Đế ngoài + dây + chống nước"}, {"cat": "Công nghệ", "title": "Puma NITRO / PUMAGRIP (Puma)", "text": "Foam NITRO (nitrogen-infused, dùng trên Deviate/Velocity Nitro) siêu nhẹ; PUMAGRIP là cao su bám đặc trưng.\n• Ưu điểm: Giá tốt so với hiệu năng (Nitro series 3–4 triệu); Deviate Nitro được đánh giá cực đáng tiền cho chạy daily/tempo.\n• Nhược điểm: Thương hiệu chạy ít phổ biến tại VN hơn Nike/Adidas/Asics → khó được ưu tiên theo thói quen.\n• Phù hợp: Chạy hàng ngày (Velocity Nitro), race/tempo (Deviate/ForeverRun), ngân sách 2.5–4 triệu.\n• So sánh: Tương đương PWRRUN (Saucony) và Fresh Foam (NB) về phân khúc; độ đàn hồi NITRO khá tốt so với giá.", "tags": "Puma NITRO / PUMAGRIP công nghệ đế đệm Foam + đế ngoài"}, {"cat": "Công nghệ", "title": "Vans PopCush / ComfyCush / UltraCush (Vans)", "text": "Ba thế hệ lót: UltraCush (mềm, đàn hồi), ComfyCush (êm hơn, bền hơn), PopCush (phản hồi tốt nhất — dùng trên Old Skool/Sk8-Hi bản Skate & một số Classic nâng cấp).\n• Ưu điểm: Nâng đáng kể độ êm so với lót gốc 'mỏng dã man' của Vans Classic; vẫn giữ được form giày.\n• Nhược điểm: Nếu mua Vans Classic bản cơ bản thì vẫn mỏng — phải chọn đúng bản có công nghệ mới được êm.\n• Phù hợp: Đi hằng ngày, skate (bản Skate), người thấy Vans classic đau chân.\n• So sánh: Đừng nhầm: Vans Classic (mỏng, cứng) khác Vans với PopCush (êm hơn); tư vấn khách kỹ điểm này.", "tags": "Vans PopCush / ComfyCush / UltraCush công nghệ đế đệm Lót/đệm trong"}, {"cat": "Công nghệ", "title": "Vans Waffle (đế bánh tổ ong) (Vans)", "text": "Đế cao su hình waffle ra đời 1966 — họa tiết bánh quế giúp bám ván trượt, hiện vẫn giữ ở hầu hết mẫu Vans.\n• Ưu điểm: Bám tốt, thẩm mỹ đặc trưng, bền; dễ nhận biết chính hãng khi kiểm tra đế.\n• Nhược điểm: Waffle cứng, đi lâu mỏi chân hơn đế foam; trơn trên mặt ướt bóng.\n• Phù hợp: Skate, đi dạo nhẹ; ai thích retro 'chân thực'.\n• So sánh: Dày và cứng hơn đế cao su của Converse (Chuck 70 dùng đế cao su dày có đường viền).", "tags": "Vans Waffle (đế bánh tổ ong) công nghệ đế đệm Đế ngoài"}, {"cat": "Công nghệ", "title": "Converse CX / OrthoLite (Converse)", "text": "CX = foam mới (2019) kết hợp vải dệt, êm gấp ~2 lần đế cao su truyền thống, dùng trên bản CX, Run Star Motion; lót OrthoLite ở Chuck 70.\n• Ưu điểm: Chuck 70 rất êm so với All Star thường; CX thêm đệm gót rõ rệt.\n• Nhược điểm: Chuck Taylor cổ điển vẫn 'đế cứng, mỏng' — nhiều khách mua nhầm bản classic rồi kêu đau chân.\n• Phù hợp: Đi làm/học cần déjà vừa êm vừa retro; Chuck 70 là nâng cấp đáng giá so với All Star.\n• So sánh: Chuck 70 (êm hơn, vải dày) vs All Star Classic (mỏng, rẻ hơn ~400–700k) — luôn tư vấn rõ khi khách hỏi.", "tags": "Converse CX / OrthoLite công nghệ đế đệm Đệm"}, {"cat": "Công nghệ", "title": "Dr. Martens AirWair (Bouncing Soles) (Dr. Martens)", "text": "Đế khí đặc trưng có logo 'AirWair with Bouncing Soles' in trên gót, làm từ PVC gắn nhiệt; da Smooth cứng định hình.\n• Ưu điểm: Bền khủng khiếp (nhiều đôi đi 5–10 năm), chống nước tốt, giữ form; đế chống trượt tốt.\n• Nhược điểm: Mới mua rất cứng — phải 'break-in' 1–2 tuần, dễ đau gót/đau mắt cá; nặng hơn sneaker.\n• Phù hợp: Thời tiết mưa, đi làm/phượt, gu rock/punk; chân bè nên lên +0.5 size với da Smooth.\n• So sánh: 1460 (boot cổ cao) vs 1461 (giày 3 lỗ) vs 1461 Quad (đế 5cm). Nhẹ hơn Timberland nhưng kém cách nhiệt hơn.", "tags": "Dr. Martens AirWair (Bouncing Soles) công nghệ đế đệm Đế + khí"}, {"cat": "Công nghệ", "title": "Crocs Croslite (Crocs)", "text": "Nhựa EVA đúc đặc trưng, siêu nhẹ, đàn hồi, kháng khuẩn, khô nhanh — làm nên Classic Clog huyền thoại.\n• Ưu điểm: Nhẹ, dễ vệ sinh (rửa nước được), thoáng mát; hợp đi chợ/mưa/phượt nhẹ; giá 1–1.6 triệu.\n• Nhược điểm: Độ dính đế kém hơn cao su; không có cảm giác cao cấp; đi lâu mùa nóng có thể ra mồ hôi chân.\n• Phù hợp: Đi mưa, trong nhà, đi biển, chân khoẻ không cần ổn định; cả phụ huynh & sinh viên.\n• So sánh: So với Birkenstock EVA (êm hơn nhưng hở nhiều), Crocs có quai giữ tốt hơn khi đi nhanh.", "tags": "Crocs Croslite công nghệ đế đệm Foam nhựa"}, {"cat": "Công nghệ", "title": "Birkenstock Cork-latex footbed (Birkenstock)", "text": "Lót đế nút bần (cork) + latex định hình theo vòm bàn chân, phủ da; chia nhiều bề ngang Regular/Narrow.\n• Ưu điểm: Định hình vòm cực tốt, giảm đau vòm bàn chân/đau gót; xu hướng 'đế cork' đang rất hot trong fashion.\n• Nhược điểm: Cứng trong tuần đầu, phải 'đúc' theo chân (2–4 tuần); không được ngâm nước.\n• Phù hợp: Đau gót/viêm cân gan chân (một phần), xu hướng fashion on-trend; chọn Narrow nếu chân thon.\n• So sánh: Cứng hơn Crocs nhiều nhưng nâng vòm tốt hơn hẳn; nhiều khách mua Arizona để đi làm hè.", "tags": "Birkenstock Cork-latex footbed công nghệ đế đệm Lót đế"}, {"cat": "Công nghệ", "title": "Biti's LiteFlex / LiteKnit / IP Phylon (Hunter X) (Biti's)", "text": "LiteFlex = đế Phylon IP (đúc khuôn) đàn hồi >40%, LiteKnit = thân dệt thoáng khí ôm chân; đôi chỉ từ ~204g (Hunter X 2k22).\n• Ưu điểm: Nhẹ, êm, thoáng, giá Việt (400–800k) — đáng tiền nhất phân khúc dưới 1 triệu tại VN; thiết kế trẻ trung.\n• Nhược điểm: Độ bền đế kém hơn giày chạy chuyên; một số dòng bị chê bong keo sau thời gian dài.\n• Phù hợp: Học sinh/sinh viên, đi học/đi chơi nhiều, ngân sách dưới 1 triệu, tập gym nhẹ.\n• So sánh: So với Skechers GOwalk (êm hơn nhưng giá gấp 1.5–2 lần) và giày Trung Quốc no-name (rẻ hơn nhưng nhanh hỏng) — Biti's là điểm cân bằng.", "tags": "Biti's LiteFlex / LiteKnit / IP Phylon (Hunter X) công nghệ đế đệm Đế + thân giày"}, {"cat": "Công nghệ", "title": "Ananas – đế cao su lưu hoá + canvas (Ananas)", "text": "Sneaker vải canvas (Basas, Vintas, Retros) với đế cao su lưu hoá (vulcanized) — kỹ thuật kế thừa từ 20 năm gia công cho Reebok, Puma, Keds, Burberry.\n• Ưu điểm: Form retro đẹp, đế lưu hoá bền và bám hơn đế dán keo, giá hợp lý (400–1.2 triệu), ủng hộ hàng Việt.\n• Nhược điểm: Đệm mỏng hơn sneaker thể thao; vải canvas bẩn khó giặt hơn da.\n• Phù hợp: Đi học/đi làm phong cách retro, phối đồ jeans/áo thun; khách hàng trẻ.\n• So sánh: Đối trọng giá rẻ của Converse Chuck/ Vans Old Skool: rẻ hơn ~50%, form tương tự, đệm tương đương hoặc nhỉnh hơn chút.", "tags": "Ananas – đế cao su lưu hoá + canvas công nghệ đế đệm Đế + thân giày"}, {"cat": "Size", "title": "Bảng quy đổi size – nam", "text": "• 22.5cm → US nam 5 | US nữ 6.5 | UK 4.5 | EU 37.5\n• 23cm → US nam 5.5 | US nữ 7 | UK 5 | EU 38\n• 23.5cm → US nam 6 | US nữ 7.5 | UK 5.5 | EU 38.5\n• 24cm → US nam 6.5 | US nữ 8 | UK 6 | EU 39\n• 24.5cm → US nam 7 | US nữ 8.5 | UK 6.5 | EU 40\n• 25cm → US nam 7.5 | US nữ 9 | UK 7 | EU 40.5\n• 25.5cm → US nam 8 | US nữ 9.5 | UK 7.5 | EU 41\n• 26cm → US nam 8.5 | US nữ 10 | UK 8 | EU 42\n• 26.5cm → US nam 9 | US nữ 10.5 | UK 8.5 | EU 42.5\n• 27cm → US nam 9.5 | US nữ 11 | UK 9 | EU 43\n• 27.5cm → US nam 10 | US nữ 11.5 | UK 9.5 | EU 44\n• 28cm → US nam 10.5 | US nữ 12 | UK 10 | EU 44.5\n• 28.5cm → US nam 11 | US nữ 12.5 | UK 10.5 | EU 45\n• 29cm → US nam 11.5 | US nữ 13 | UK 11 | EU 45.5\n• 29.5cm → US nam 12 | US nữ 13.5 | UK 11.5 | EU 46\n• 30cm → US nam 12.5 | US nữ 14 | UK 12 | EU 47", "tags": "bảng size quy đổi cm us uk eu nam"}, {"cat": "Size", "title": "Bảng quy đổi size – nữ", "text": "• 21.5cm → US nam 5 | US nữ 3.5 | UK 2.5 | EU 35\n• 22cm → US nam 5.5 | US nữ 4 | UK 3 | EU 35.5\n• 22.5cm → US nam 6 | US nữ 4.5 | UK 3.5 | EU 36\n• 23cm → US nam 6.5 | US nữ 5 | UK 4 | EU 36.5\n• 23.5cm → US nam 7 | US nữ 5.5 | UK 4.5 | EU 37.5\n• 24cm → US nam 7.5 | US nữ 6 | UK 5 | EU 38\n• 24.5cm → US nam 8 | US nữ 6.5 | UK 5.5 | EU 38.5\n• 25cm → US nam 8.5 | US nữ 7 | UK 6 | EU 39\n• 25.5cm → US nam 9 | US nữ 7.5 | UK 6.5 | EU 40\n• 26cm → US nam 9.5 | US nữ 8 | UK 7 | EU 40.5\n• 26.5cm → US nam 10 | US nữ 8.5 | UK 7.5 | EU 41\n• 27cm →
